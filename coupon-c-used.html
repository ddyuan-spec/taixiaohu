<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的优惠券-已使用</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:#f5f5f5;max-width:375px;margin:0 auto;min-height:100vh}
.nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:14px 16px;text-align:center;font-size:17px;font-weight:600;color:#333}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee}
.tabs a{flex:1;text-align:center;padding:12px 0;font-size:14px;color:#666;text-decoration:none;position:relative}
.tabs a.active{color:#534AB7;font-weight:600}
.tabs a.active::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:24px;height:2px;background:#534AB7;border-radius:1px}
.list{padding:12px}
.coupon{display:flex;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.coupon .left{width:105px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0;background:#d9d9d9}
.coupon .left .amt{font-size:34px;font-weight:700;line-height:1.1}
.coupon .left .amt sub{font-size:13px;font-weight:400;vertical-align:baseline}
.coupon .left .cond{font-size:11px;margin-top:2px;opacity:.85}
.coupon .right{flex:1;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between}
.coupon .right .cname{font-size:15px;font-weight:600;color:#999;line-height:1.3}
.coupon .right .used-tag{display:inline-block;font-size:11px;color:#52c41a;background:#f6ffed;border:1px solid #b7eb8f;border-radius:8px;padding:1px 8px;margin-top:4px;width:fit-content}
.coupon .right .info-row{font-size:12px;color:#999;margin-top:4px;line-height:1.6}
.coupon .right .order-no{color:#534AB7;font-family:monospace;font-size:11px}
.coupon .right .rule-link{font-size:11px;color:#534AB7;cursor:pointer;margin-top:6px;display:inline-block}
/* 规则弹窗 */
.rule-overlay{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:24px}
.rule-overlay.show{display:flex}
.rule-card{background:#fff;border-radius:14px;width:300px;max-height:70vh;overflow-y:auto;padding:20px}
.rule-card h3{font-size:16px;text-align:center;margin-bottom:14px;color:#333}
.rule-card .ri{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.rule-card .ri .rl{color:#666}
.rule-card .ri .rr{color:#333;font-weight:500;text-align:right;max-width:60%}
.rule-close{display:block;margin:14px auto 0;background:#534AB7;color:#fff;border:none;padding:7px 28px;border-radius:16px;font-size:13px;cursor:pointer}
.copy-btn{position:fixed;right:12px;bottom:18px;z-index:50;background:#534AB7;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(83,74,183,.35);font-weight:600}
</style>
</head>
<body>

<div class="nav">我的优惠券</div>
<div class="tabs">
  <a href="coupon-c-unused.html">未使用</a>
  <a href="coupon-c-used.html" class="active">已使用</a>
  <a href="coupon-c-expired.html">已过期</a>
</div>

<div class="list" id="list"></div>

<div class="rule-overlay" id="ruleOverlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="rule-card" id="ruleCard"></div>
</div>

<button class="copy-btn" onclick="copySource()">📋 复制源码（墨刀）</button>

<script>
var coupons = [
  {name:'新人专享满99减20',amount:20,threshold:99,useTime:'2026.07.25 09:31',orderNo:'ORD20260725A31',expire:'2026.08.15',scope:'指定商品'},
  {name:'老客回馈无门槛10元',amount:10,threshold:0,useTime:'2026.07.30 14:22',orderNo:'ORD20260730B07',expire:'2026.08.21',scope:'全场通用'}
];

function render(){
  var html='';
  for(var i=0;i<coupons.length;i++){
    var c=coupons[i];
    html+='<div class="coupon">'
      +'<div class="left">'
        +'<span class="amt"><sub>¥</sub>'+c.amount+'</span>'
        +'<span class="cond">满'+c.threshold+'可用</span>'
      +'</div>'
      +'<div class="right">'
        +'<div class="cname">'+c.name+'</div>'
        +'<span class="used-tag">✓ 已核销</span>'
        +'<div class="info-row">使用时间：'+c.useTime+'</div>'
        +'<div class="info-row">关联订单：<span class="order-no">'+c.orderNo+'</span></div>'
        +'<span class="rule-link" onclick="showRule('+i+',event)">券规则 ›</span>'
      +'</div>'
    +'</div>';
  }
  document.getElementById('list').innerHTML=html;
}

function showRule(idx,e){
  e.stopPropagation();
  var c=coupons[idx];
  document.getElementById('ruleCard').innerHTML='<h3>券规则</h3>'
    +'<div class="ri"><span class="rl">券名称</span><span class="rr">'+c.name+'</span></div>'
    +'<div class="ri"><span class="rl">面额</span><span class="rr">¥'+c.amount+'</span></div>'
    +'<div class="ri"><span class="rl">使用门槛</span><span class="rr">满¥'+c.threshold+'可用</span></div>'
    +'<div class="ri"><span class="rl">有效期</span><span class="rr">至 '+c.expire+'</span></div>'
    +'<div class="ri"><span class="rl">适用范围</span><span class="rr">'+c.scope+'</span></div>'
    +'<div class="ri"><span class="rl">说明</span><span class="rr">该券已核销，不可再次使用</span></div>'
    +'<button class="rule-close" onclick="document.getElementById(\'ruleOverlay\').classList.remove(\'show\')">我知道了</button>';
  document.getElementById('ruleOverlay').classList.add('show');
}

function copySource(){
  var src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  if(navigator.clipboard){navigator.clipboard.writeText(src).then(function(){alert('已复制完整源码，去墨刀粘贴即可')})}
  else{var ta=document.createElement('textarea');ta.value.src;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('已复制完整源码，去墨刀粘贴即可')}
}

render();
</script>
</body>
</html>
