<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>优惠券体系 · App 端原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f0f1f5;color:#23252b;
  padding:32px 24px;
}
.hd{display:none}
.group-title{display:none}

.grid{
  display:flex;flex-wrap:wrap;gap:20px;justify-content:center;
  max-width:1600px;margin:0 auto;
}
.card{
  background:#fff;border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  overflow:hidden;width:320px;flex-shrink:0;
}
.card .name{display:none}
.card .name .drawn-badge{
  font-size:11px;font-weight:600;color:#07c160;
  background:#e8f9ef;padding:1px 6px;border-radius:4px;
  margin-left:6px;white-space:nowrap;
}
.card img{
  width:100%;height:auto;display:block;
}

.group-title{display:none}
</style>
</head>
<body>

<div class="hd">
  <h1>🎫 优惠券体系 · App 端原型</h1>
  <span class="sub">用户侧 — 最新截图</span>
</div>

<div class="grid">

<div class="group-title">我的 / 资产线</div>

<!-- ① 我的（个人中心） -->
<div class="card">
  <div class="name">U 我的（资产入口）</div>
  <img src="coupon-prd-assets/app-my-profile.png" alt="我的">
</div>

<!-- ② 我的优惠券（空态） -->
<div class="card">
  <div class="name">C2 我的优惠券（空态）</div>
  <img src="coupon-prd-assets/app-my-coupons-empty.png" alt="我的优惠券空态">
</div>

<!-- ③ 我的优惠券（三态） -->
<div class="card">
  <div class="name">C2 我的优惠券（待使用 / 已使用 / 已过期）<span class="drawn-badge">自画</span></div>
  <img src="coupon-prd-assets/app-c2-coupons-drawn.png" alt="我的优惠券三态">
</div>

<!-- ④ 跨端口置灰券 -->
<div class="card">
  <div class="name">C2 跨端口置灰券 + 提示<span class="drawn-badge">自画</span></div>
  <img src="coupon-prd-assets/app-c2-port-restrict-drawn.png" alt="跨端口置灰券">
</div>

<div class="group-title">商城购买线</div>

<!-- ⑤ 商品详情 -->
<div class="card">
  <div class="name">C5 商品详情（优惠券入口条）<span class="drawn-badge">自画</span></div>
  <img src="coupon-prd-assets/app-c5-product-entry.png" alt="商品详情优惠券入口">
</div>

<!-- ⑥ 优惠详情底部弹窗 -->
<div class="card">
  <div class="name">C5 优惠详情底部弹窗（券列表 + 券规则 ›）<span class="drawn-badge">自画</span></div>
  <img src="coupon-prd-assets/app-c5-coupon-modal.png" alt="优惠详情弹窗">
</div>

<!-- ⑦ 券规则页 -->
<div class="card">
  <div class="name">C5 券规则页（富文本渲染）<span class="drawn-badge">自画</span></div>
  <img src="coupon-prd-assets/app-coupon-rules-drawn.png" alt="券规则页">
</div>

<!-- ⑧ 确认订单（单SKU·券作用于SKU行） -->
<div class="card">
  <div class="name">C6 确认订单（单SKU · 券作用于SKU行）<span class="drawn-badge">自画</span></div>
  <img src="coupon-prd-assets/app-c6-order-single-sku-drawn.png" alt="确认订单单SKU">
</div>

<!-- ⑨ 多SKU券适用商品 -->
<div class="card">
  <div class="name">C6 优惠券适用商品（多SKU券分摊）<span class="drawn-badge">自画</span></div>
  <img src="coupon-prd-assets/app-c6-coupon-sku-scope-drawn.png" alt="多SKU券适用商品">
</div>

<!-- ⑩ 选择优惠券弹窗 -->
<div class="card">
  <div class="name">C6 选择优惠券弹窗（含可用券 + 券规则入口）<span class="drawn-badge">自画</span></div>
  <img src="coupon-prd-assets/app-select-coupon-with-coupon-drawn.png" alt="选择优惠券弹窗">
</div>

<!-- ⑪ 确认订单（无券态） -->
<div class="card">
  <div class="name">C6 确认订单（无券态）</div>
  <img src="coupon-prd-assets/app-confirm-order.png" alt="确认订单无券">
</div>

<!-- ⑫ 确认订单（含优惠券） -->
<div class="card">
  <div class="name">C6 确认订单（含优惠券）</div>
  <img src="coupon-prd-assets/app-confirm-order-with-coupon.png" alt="确认订单含券">
</div>

</div>
</body>
</html>
