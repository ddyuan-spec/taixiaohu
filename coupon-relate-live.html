<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰小虎 · 平台端后台 — 关联直播需求原型</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#333;font-size:13px}
  /* ===== Top Bar ===== */
  .topbar{height:48px;background:#534AB7;color:#fff;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
  .topbar .logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .topbar .logo::before{content:'';display:inline-block;width:20px;height:20px;border-radius:4px;background:rgba(255,255,255,.2)}
  .topbar .sys{opacity:.75;font-size:12px}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:18px;cursor:pointer}

  /* ===== Layout ===== */
  .layout{display:flex;min-height:calc(100vh - 48px)}

  /* ===== Sidebar ===== */
  .side{width:196px;background:#fff;border-right:1px solid #eaeaea;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
  .side .group{padding:0}
  .side .gtitle{font-size:11px;color:#999;padding:14px 16px 6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;gap:4px}
  .side .gtitle .arr{font-size:10px;transition:transform .2s}
  .side .gtitle.open .arr{transform:rotate(90deg)}
  .side a{display:block;padding:9px 16px 9px 28px;color:#555;text-decoration:none;font-size:13px;cursor:pointer;transition:background .15s,color .15s;position:relative}
  .side a:hover{background:#f8f7ff;color:#534AB7}
  .side a.active{background:#f3f0ff;color:#534AB7;font-weight:500;border-right:3px solid #534AB7}

  /* ===== Main Content ===== */
  .main{flex:1;padding:18px 24px 60px;min-width:0}
  .hidden{display:none!important}

  /* ===== Breadcrumb ===== */
  .crumb{font-size:12px;color:#999;margin-bottom:14px}
  .crumb span{color:#333}
  .crumb a{color:#534AB7;cursor:pointer;text-decoration:none}

  /* ===== Page Header ===== */
  .phead{display:flex;align-items:center;margin-bottom:14px;gap:10px}
  .phead h2{font-size:17px;font-weight:600;color:#222}

  /* ===== Filter Bar ===== */
  .filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filter-bar input,.filter-bar select{height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;font-size:12px;color:#333;outline:none;background:#fff;transition:border-color .2s}
  .filter-bar input:focus,.filter-bar select:focus{border-color:#534AB7}
  .filter-bar input{width:180px}
  .filter-bar select{width:130px}
  .fb-label{font-size:12px;color:#666;white-space:nowrap}

  /* ===== Buttons ===== */
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 16px;background:#534AB7;color:#fff;border:none;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .2s}
  .btn-primary:hover{background:#453da0}
  .btn-ghost{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 16px;background:#fff;color:#666;border:1px solid #dcdfe6;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s}
  .btn-ghost:hover{color:#534AB7;border-color:#534AB7}
  .btn-link{background:none;border:none;color:#534AB7;cursor:pointer;font-size:12px;padding:0 4px}
  .btn-link.red{color:#f56c6c}
  .btn-link:hover{text-decoration:underline}
  .btn-sm{height:28px;padding:0 12px;font-size:12px}

  /* ===== Table ===== */
  .tbl-wrap{background:#fff;border:1px solid #ebeef5;border-radius:4px;overflow:hidden}
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl thead th{background:#fafbfc;border-bottom:1px solid #ebeef5;color:#909399;font-weight:500;text-align:left;padding:10px 12px;white-space:nowrap;font-size:12px}
  .tbl tbody td{border-bottom:1px solid #f0f0f0;padding:10px 12px;color:#333;vertical-align:middle}
  .tbl tbody tr:hover{background:#fafbfc}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl .chk{width:36px;text-align:center}
  .tbl .act a{margin-right:8px}

  /* ===== Pagination ===== */
  .pagi{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px;font-size:12px;color:#666}
  .pagi input{width:40px;height:28px;border:1px solid #dcdfe6;border-radius:4px;text-align:center;font-size:12px;outline:none}
  .pagi select{height:28px;border:1px solid #dcdfe6;border-radius:4px;font-size:12px;outline:none}
  .pagi .pg-btn{min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #dcdfe6;border-radius:4px;cursor:pointer;font-size:12px;color:#606266;background:#fff}
  .pg-btn.active{background:#534AB7;color:#fff;border-color:#534AB7}
  .pg-btn:hover:not(.active){color:#534AB7;border-color:#534AB7}

  /* ===== Tags / Status ===== */
  .tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11.5px;line-height:1.6}
  .tag-green{background:#f0f9eb;color:#67c23a;border:1px solid #c2e7b0}
  .tag-gray{background:#f4f4f5;color:#909399;border:1px solid #d3d4d6}
  .tag-blue{background:#ecf5ff;color:#409eff;border:1px solid #b3d8ff}
  .tag-orange{background:#fdf6ec;color:#e6a23c;border:1px solid #faecd8}
  .tag-purple{background:#f0ecff;color:#7c3aed;border:1px solid #d4c8ff}

  /* Empty state */
  .empty-state{text-align:center;padding:50px 0;color:#c0c4cc}
  .empty-state .icon{font-size:48px;margin-bottom:10px;opacity:.35}

  /* ===== Detail view ===== */
  .dt-back{display:inline-flex;align-items:center;gap:4px;color:#534AB7;cursor:pointer;font-size:13px;margin-right:8px}
  .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border:1px solid #ebeef5;border-radius:4px;overflow:hidden;margin-bottom:16px}
  .info-cell{padding:12px 16px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0}
  .info-cell .k{font-size:12px;color:#909399;margin-bottom:4px}
  .info-cell .v{font-size:13px;color:#333}

  /* ===== Form (独立编辑页) ===== */
  .form-section{background:#fff;border:1px solid #ebeef5;border-radius:4px;padding:24px 28px;max-width:820px}
  .form-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
  .fr-label{width:110px;font-size:13px;color:#606266;line-height:32px;flex-shrink:0;text-align:right;padding-right:8px}
  .fr-label .req{color:#f56c6c;margin-right:2px}
  .fr-body{flex:1;min-width:0}
  .fr-input{height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;font-size:13px;width:100%;outline:none}
  .fr-input:focus{border-color:#534AB7}
  select.fr-input{width:100%}
  .form-actions{display:flex;gap:10px;margin-top:24px;padding-left:130px}

  /* Multi-select room picker */
  .room-picker{border:1px solid #dcdfe6;border-radius:4px;padding:8px;min-height:80px;max-height:180px;overflow-y:auto;background:#fafbfc}
  .room-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:3px;cursor:pointer;transition:background .15s}
  .room-item:hover{background:#f0ecff}
  .room-item.selected{background:#f3f0ff}
  .room-item input[type=checkbox]{accent-color:#534AB7;pointer-events:none}
  .room-item .rname{font-size:13px;flex:1}
  .room-item .rid{font-size:11px;color:#999}

  .rule-detail{font-size:11.5px;color:#666;line-height:1.7}
  .rule-detail b{color:#333}

  .switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#ccc;border-radius:22px;cursor:pointer;transition:.2s}
  .slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
  input:checked+.slider{background:#534AB7}
  input:checked+.slider::before{transform:translateX(18px)}

  /* Toast */
  .toast{position:fixed;top:62px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:999}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 直播间管理卡片 ===== */
  .room-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .room-card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:box-shadow .2s;cursor:pointer}
  .room-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .room-card .cover{height:130px;background:linear-gradient(135deg,#e0e7ff 0%,#d1d5ff 100%);display:flex;align-items:center;justify-content:center;position:relative}
  .room-card .cover .play{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:18px;color:#534AB7;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .room-card .cover .status{position:absolute;top:10px;left:10px}
  .room-card .info{padding:12px}
  .room-card .info .name{font-size:14px;font-weight:600;color:#222;margin-bottom:8px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .room-card .info .meta{font-size:12px;color:#909399;margin-bottom:10px}
  .room-card .info .enter{color:#534AB7;font-size:13px;cursor:pointer}
  .room-card .info .enter:hover{text-decoration:underline}

  /* ===== 新建直播间 · 发券活动九宫格选择 ===== */
  .act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:360px;overflow-y:auto;padding:2px}
  .act-card{border:1px solid #dcdfe6;border-radius:8px;padding:12px;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s;position:relative}
  .act-card:hover{border-color:#534AB7}
  .act-card.selected{border-color:#534AB7;background:#f3f0ff;box-shadow:0 2px 8px rgba(83,74,183,.15)}
  .act-card .act-check{position:absolute;top:10px;right:10px;width:18px;height:18px;accent-color:#534AB7;pointer-events:none}
  .act-card .act-name{font-size:14px;font-weight:600;color:#222;margin-bottom:8px;padding-right:24px;line-height:1.4}
  .act-card .act-row{display:flex;font-size:12px;line-height:1.7}
  .act-card .act-k{flex:0 0 64px;color:#909399}
  .act-card .act-v{flex:1;color:#333}
  .act-hint{font-size:12px;color:#909399;margin-top:8px}
  .act-hint b{color:#534AB7}

/* embed mode: hide topbar & sidebar when ?embed=1 */
body.embed-mode .topbar{display:none}
body.embed-mode .side{display:none}
body.embed-mode .layout{display:block;min-height:100vh}
body.embed-mode .main{padding-top:18px}
body.embed-mode .crumb{display:none}
</style>
</head>
<body>
<script>
/* embed mode detection */
if(location.search.includes('embed=1')) document.body.classList.add('embed-mode');
</script>


<!-- ===== Top Bar ===== -->
<div class="topbar">
  <div class="logo">泰小虎后台</div>
  <span class="sys">运营管理平台 · 关联直播</span>
  <div class="right"><span>🔔</span><span>👤</span></div>
</div>

<div class="layout">

<!-- ===== Sidebar （仅关联直播相关） ===== -->
<nav class="side" id="sidebar">
  <div class="group">
    <div class="gtitle open"><span class="arr">▶</span> 营销管理</div>
    <a href="#liveViewLog" onclick="go('liveViewLog')" id="nav_liveViewLog">直播观看记录</a>
  </div>
  <div class="group">
    <div class="gtitle open"><span class="arr">▶</span> 直播管理</div>
    <a href="#直播间管理" onclick="go('liveRoom')" id="navLiveRoom" class="active">直播间管理</a>
  </div>
</nav>

<!-- ===== Main Content ===== -->
<main class="main" id="mainContent">

  <!-- ==================== 直播间管理 ==================== -->
  <div id="viewLiveRoom">
    <div class="crumb"><a>首页</a> / <a>直播管理</a> / <span>直播间管理</span></div>
    <div class="phead">
      <h2>直播间管理</h2>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn-primary" onclick="go('liveRoomAdd')">＋ 新建直播</button>
      </div>
    </div>

    <div class="filter-bar">
      <span class="fb-label">状态:</span>
      <select id="lrStatus" style="width:120px">
        <option value="">全部状态</option>
        <option value="预告">预告</option>
        <option value="直播中">直播中</option>
        <option value="已结束">已结束</option>
      </select>
      <input placeholder="直播间名称" id="lrKeyword" style="width:200px">
      <button class="btn-primary" onclick="renderLiveRooms()">搜索</button>
      <button class="btn-ghost" onclick="resetLiveRoomFilter()">重置</button>
    </div>

    <div id="liveRoomGrid" class="room-grid"></div>

    <div class="pagi" style="margin-top:18px">
      共 <b id="liveRoomCount">0</b> 条
      <select><option>12条/页</option></select>
      <span class="pg-btn active">1</span>
    </div>
  </div>

  <!-- ==================== 直播观看记录（列表） ==================== -->
  <div id="viewLiveViewLog" class="hidden">
    <div class="crumb"><a>首页</a> / <a>营销管理</a> / <span>直播观看记录</span></div>
    <div class="phead"><h2>直播观看记录</h2></div>

    <div class="filter-bar">
      <span class="fb-label">直播间ID:</span>
      <select id="lvRoom">
        <option value="">全部直播间</option>
        <option>LIVE001</option>
        <option>LIVE002</option>
        <option>LIVE003</option>
      </select>
      <input placeholder="昵称 / 手机号 / 用户ID" id="lvKeyword" style="width:200px">
      <button class="btn-primary" onclick="renderLiveView()">搜索</button>
      <button class="btn-ghost" onclick="resetLiveView()">重置</button>
      <button class="btn-ghost" onclick="exportLiveView()">导出</button>
    </div>

    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th class="chk"><input type="checkbox"></th>
            <th>昵称</th>
            <th>手机号</th>
            <th>用户ID</th>
            <th>观看直播间ID</th>
            <th>进入时间</th>
            <th>退出时间</th>
            <th>观看时长</th>
            <th>观看时直播状态</th>
            <th>操作</th>
          </tr>
        </thead>

      </table>
    </div>

    <div class="pagi">

      <span>跳至</span>
      <input value="1">
      <span>页</span>
    </div>
  </div>

  <!-- ==================== 直播观看记录 · 详情 ==================== -->
  <div id="viewLiveViewDetail" class="hidden">
    <div class="crumb"><a>首页</a> / <a>营销管理</a> / <a onclick="go('liveViewLog')">直播观看记录</a> / <span>观看详情</span></div>
    <div class="phead">
      <span class="dt-back" onclick="go('liveViewLog')">← 返回列表</span>
      <h2>观看详情</h2>
    </div>
    <div class="info-grid" id="dtGrid"></div>
  </div>

  <!-- ==================== 新建直播间（独立页面） ==================== -->
  <div id="viewLiveRoomAdd" class="hidden">
    <div class="crumb"><a onclick="go('liveRoom')">首页</a> / <a onclick="go('liveRoom')">直播管理</a> / <a onclick="go('liveRoom')">直播间管理</a> / <span>新建直播间</span></div>
    <div class="phead"><h2>新建直播间</h2></div>
    <div class="form-section">
      <div class="form-row">
        <label class="fr-label"><span class="req">*</span>直播间名称</label>
        <div class="fr-body"><input class="fr-input" id="lmName" placeholder="请输入直播间的名称"></div>
      </div>
      <div class="form-row">
        <label class="fr-label">选择发券活动</label>
        <div class="fr-body">
          <div class="act-grid" id="actGrid"></div>
          <div class="act-hint">已选 <b id="actCount">0</b> 个发券活动（选填，可多选）｜仅展示「进行中 / 未开始」的活动</div>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-ghost" onclick="go('liveRoom')">取消</button>
        <button class="btn-primary" onclick="saveLiveRoom()">创建</button>
      </div>
    </div>
  </div>

</main>
</div>

<script>
/* ====== Util ====== */
function $(id){return document.getElementById(id)}

/* ====== Toast ====== */
function toast(msg,err){
  var t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':'');
  setTimeout(function(){t.classList.remove('show')},2200);
}

/* ====== Navigation ====== */
var PAGES = ['viewLiveRoom','viewLiveRoomAdd','viewLiveViewLog','viewLiveViewDetail'];
var NAVMAP = { liveRoom:'navLiveRoom', liveViewLog:'nav_liveViewLog' };
function go(page){
  document.querySelectorAll('#sidebar a').forEach(function(a){a.classList.remove('active')});
  PAGES.forEach(function(p){$(p).classList.add('hidden')});
  if(NAVMAP[page]) $(NAVMAP[page]).classList.add('active');

  if(page==='liveRoom'){ $('viewLiveRoom').classList.remove('hidden'); renderLiveRooms(); }
  else if(page==='liveRoomAdd'){ $('viewLiveRoomAdd').classList.remove('hidden'); resetLiveRoomAdd(); }
  else if(page==='liveViewLog'){ $('viewLiveViewLog').classList.remove('hidden'); renderLiveView(); }
  else if(page==='liveViewDetail'){ $('viewLiveViewDetail').classList.remove('hidden'); }
}

/* ================================================================
   数据
   ================================================================ */

/* ================================================================

   ================================================================ */

  {id:'LIVE007',name:'24342423',status:'已结束',time:'2026-07-31 10:28'},
  {id:'LIVE008',name:'直播测试',status:'已结束',time:'2026-07-09 20:00'}
];
var statusCls={预告:'tag-blue',直播中:'tag-green',已结束:'tag-gray'};

/* ============ 发券活动（直播间新建时供选择） ============ */
var couponActivities=[
  {id:1,name:'7月直播时长发券-A',type:'直播时长',threshold:'观看满30分钟',coupons:['新人满99减20','无门槛5元代金'],ports:['App','H5','小程序'],perUser:1,perDay:1,status:'进行中',issued:89},
  {id:2,name:'老带新分享发券-B',type:'分享活动',threshold:'绑定用户数量每满10人',coupons:['无门槛5元代金'],ports:['App','H5'],perUser:3,perDay:1,status:'未开始',issued:0},
  {id:3,name:'新人福利登录发券',type:'新人福利活动',threshold:'登录触发（9.20 起）',coupons:['新人满99减20'],ports:['App','H5','小程序'],perUser:1,perDay:1,status:'未开始',issued:0},
  {id:4,name:'618 直播满减狂欢',type:'直播时长',threshold:'观看满15分钟',coupons:['老券满200减30','全场8折券'],ports:['App','H5','小程序'],perUser:1,perDay:1,status:'进行中',issued:212},
  {id:5,name:'VIP 专享直播发券',type:'直播时长',threshold:'观看满60分钟',coupons:['VIP专享满500减80'],ports:['App','H5','小程序'],perUser:1,perDay:1,status:'未开始',issued:0},

}
function toggleAct(el){
  var chk=el.querySelector('.act-check');
  chk.checked=!chk.checked;
  el.classList.toggle('selected',chk.checked);
  updateActCount();
}
function updateActCount(){
  $('actCount').textContent=document.querySelectorAll('#actGrid .act-card.selected').length;
}
function getSelectedActIds(){
  return Array.from(document.querySelectorAll('#actGrid .act-card.selected')).map(function(c){return parseInt(c.dataset.id);});
}

function renderLiveRooms(){
  var st=$('lrStatus').value, kw=$('lrKeyword').value.trim();
  var rows='', cnt=0, filtered=[];
  liveRooms.forEach(function(r){
    if(st && r.status!==st) return;
    if(kw && r.name.indexOf(kw)<0) return;
    filtered.push(r);
  });
  filtered.forEach(function(r){
    cnt++;
    rows += '<div class="room-card">'+
      '<div class="cover">'+
        '<span class="status tag '+statusCls[r.status]+'">'+r.status+'</span>'+
        '<div class="play">▶</div>'+
      '</div>'+
      '<div class="info">'+
        '<div class="name">'+r.name+'</div>'+
        '<div class="meta">'+r.time+(r.acts&&r.acts.length?(' · 关联 '+r.acts.length+' 个发券活动'):'')+'</div>'+
        '<div class="enter">观看直播</div>'+
      '</div>'+
    '</div>';
  });
  $('liveRoomGrid').innerHTML = rows || '<div class="empty-state" style="grid-column:1/-1"><div class="icon">📺</div><div>暂无直播间</div></div>';
  $('liveRoomCount').textContent = cnt;
}
function resetLiveRoomFilter(){ $('lrStatus').value=''; $('lrKeyword').value=''; renderLiveRooms(); }
function resetLiveRoomAdd(){
  $('lmName').value='';
  renderActGrid();
  updateActCount();
}
function saveLiveRoom(){
  var name=$('lmName').value.trim();
  if(!name){toast('请输入直播间名称',true);return;}
  var acts=getSelectedActIds();
  var id='LIVE'+(liveRooms.length+1).toString().padStart(3,'0');
  liveRooms.unshift({id:id,name:name,status:'预告',time:new Date().toLocaleString().replace(/\//g,'-').slice(0,16),acts:acts});
  toast('创建成功');
  go('liveRoom');
}
