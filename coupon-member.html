<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰小虎 · 会员中心 — 批量送券原型</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#333;font-size:13px}

  /* ===== Top Bar ===== */
  .topbar{height:48px;background:#534AB7;color:#fff;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
  .topbar .logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .topbar .logo::before{content:'';display:inline-block;width:20px;height:20px;border-radius:4px;background:rgba(255,255,255,.2)}
  .topbar .sys{opacity:.75;font-size:12px}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:18px;cursor:pointer}

  /* ===== Layout ===== */
  .layout{display:flex;min-height:calc(100vh - 48px)}

  /* ===== Sidebar ===== */
  .side{width:196px;background:#fff;border-right:1px solid #eaeaea;display:flex;flex-direction:column;flex-shrink:0}
  .side .nav-group{border-bottom:1px solid #f4f4f5}
  .side .gtitle{font-size:11px;color:#999;padding:14px 16px 6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;gap:4px;user-select:none}
  .side .gtitle .arr{display:inline-block;font-size:9px;color:#bbb;margin-right:3px}
  .side .nav-body{display:none;padding-bottom:4px}
  .side .nav-group.open .nav-body{display:block}
  .side a{display:block;padding:9px 16px 9px 28px;color:#555;text-decoration:none;font-size:13px;cursor:pointer;transition:background .15s,color .15s;position:relative}
  .side a:hover{background:#f8f7ff;color:#534AB7}
  .side a.active{background:#f3f0ff;color:#534AB7;font-weight:500;border-right:3px solid #534AB7}
  .side a.indent{padding-left:40px}

  /* ===== Main Content ===== */
  .main{flex:1;padding:18px 24px 60px;min-width:0}
  .crumb{font-size:12px;color:#999;margin-bottom:14px}
  .crumb span{color:#333}
  .phead{display:flex;align-items:center;margin-bottom:14px;gap:10px}
  .phead h2{font-size:17px;font-weight:600;color:#222}

  /* ===== Filter Bar ===== */
  .filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;background:#fff;padding:14px;border:1px solid #ebeef5;border-radius:4px}
  .filter-bar input,.filter-bar select{height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;font-size:12px;color:#333;outline:none;background:#fff;transition:border-color .2s}
  .filter-bar input:focus,.filter-bar select:focus{border-color:#534AB7}
  .filter-bar input{width:180px}
  .filter-bar select{width:120px}
  .fb-label{font-size:12px;color:#666;white-space:nowrap}
  .filter-actions{margin-left:auto;display:flex;gap:8px}

  /* ===== Buttons ===== */
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 16px;background:#534AB7;color:#fff;border:none;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .2s}
  .btn-primary:hover{background:#453da0}
  .btn-primary:disabled{background:#a8a0dc;cursor:not-allowed}
  .btn-ghost{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 16px;background:#fff;color:#666;border:1px solid #dcdfe6;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s}
  .btn-ghost:hover{color:#534AB7;border-color:#534AB7}
  .btn-sm{height:26px;padding:0 10px;font-size:12px}
  .btn-link{background:none;border:none;color:#534AB7;cursor:pointer;font-size:12px;padding:0 4px}
  .btn-link:hover{text-decoration:underline}
  .btn-link.red{color:#f56c6c}

  /* ===== Toolbar ===== */
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .toolbar-left{display:flex;gap:8px}
  .toolbar-right{display:flex;gap:8px}

  /* ===== Table ===== */
  .tbl-wrap{background:#fff;border:1px solid #ebeef5;border-radius:4px;overflow:hidden}
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl thead th{background:#fafbfc;border-bottom:1px solid #ebeef5;color:#909399;font-weight:500;text-align:left;padding:10px 12px;white-space:nowrap;font-size:12px}
  .tbl tbody td{border-bottom:1px solid #f0f0f0;padding:10px 12px;color:#333;vertical-align:middle}
  .tbl tbody tr:hover{background:#fafbfc}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl .chk{width:36px;text-align:center}
  .tbl .act a{margin-right:8px}
  .tbl .act a:last-child{margin-right:0}

  /* ===== User Cell ===== */
  .user-cell{display:flex;align-items:center;gap:10px}
  .user-avatar{width:36px;height:36px;border-radius:50%;background:#f0f0f5;display:flex;align-items:center;justify-content:center;font-size:14px;color:#666;flex-shrink:0}
  .user-info{min-width:0}
  .user-name{font-size:13px;color:#333;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-phone{font-size:12px;color:#909399;margin-top:2px}

  /* ===== Tags ===== */
  .tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11.5px;line-height:1.6}
  .tag-purple{background:#f3f0ff;color:#534AB7;border:1px solid #d9d2ff}
  .tag-gray{background:#f4f4f5;color:#909399;border:1px solid #d3d4d6}
  .tag-green{background:#f0f9eb;color:#67c23a;border:1px solid #c2e7b0}

  /* ===== Pagination ===== */
  .pagi{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px;font-size:12px;color:#666}
  .pagi input{width:40px;height:28px;border:1px solid #dcdfe6;border-radius:4px;text-align:center;font-size:12px;outline:none}
  .pagi select{height:28px;border:1px solid #dcdfe6;border-radius:4px;font-size:12px;outline:none}
  .pagi .pg-btn{min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #dcdfe6;border-radius:4px;cursor:pointer;font-size:12px;color:#606266;background:#fff}
  .pg-btn.active{background:#534AB7;color:#fff;border-color:#534AB7}
  .pg-btn:hover:not(.active){color:#534AB7;border-color:#534AB7}

  /* ===== Modal ===== */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal-dlg{background:#fff;border-radius:6px;width:680px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:85vh}
  .modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #ebeef5}
  .modal-title{font-size:15px;font-weight:600;color:#222}
  .modal-close{background:none;border:none;font-size:18px;color:#c0c4cc;cursor:pointer;padding:2px 6px;border-radius:3px}
  .modal-close:hover{color:#606266;background:#f0f0f0}
  .modal-body{padding:16px 18px;overflow:auto;flex:1}
  .modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 18px;border-top:1px solid #ebeef5;background:#fafbfc;border-radius:0 0 6px 6px}

  /* ===== Coupon Select List ===== */
  .cp-search{display:flex;gap:8px;margin-bottom:12px}
  .cp-search input{flex:1;height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;font-size:12px;outline:none}
  .cp-search input:focus{border-color:#534AB7}
  .cp-list{border:1px solid #ebeef5;border-radius:4px;overflow:hidden}
  .cp-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
  .cp-item:last-child{border-bottom:none}
  .cp-item:hover{background:#fafbfc}
  .cp-item.selected{background:#f3f0ff}
  .cp-radio{width:18px;height:18px;border:2px solid #dcdfe6;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
  .cp-item.selected .cp-radio{border-color:#534AB7}
  .cp-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:#534AB7;display:none}
  .cp-item.selected .cp-radio::after{display:block}
  .cp-info{flex:1;min-width:0}
  .cp-name{font-size:13px;color:#333;font-weight:500;margin-bottom:4px}
  .cp-meta{font-size:12px;color:#909399}
  .cp-meta span{margin-right:12px}
  .cp-tag{font-size:11px;padding:1px 6px;border-radius:3px}
  .cp-tag.enabled{background:#f0f9eb;color:#67c23a;border:1px solid #c2e7b0}
  .cp-tag.offline{background:#f4f4f5;color:#909399;border:1px solid #d3d4d6}
  .cp-empty{text-align:center;padding:40px 0;color:#c0c4cc;font-size:13px}
  .cp-count{color:#534AB7;font-weight:600}

  /* ===== Selected Users Summary ===== */
  .selected-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f3f0ff;border:1px solid #d9d2ff;border-radius:4px;margin-bottom:12px;font-size:12px;color:#534AB7}

  /* ===== Toast ===== */
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-60px);background:#333;color:#fff;padding:10px 22px;border-radius:6px;font-size:13px;z-index:600;transition:transform .3s;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:#f56c6c}

/* embed mode: hide topbar & sidebar when ?embed=1 */
body.embed-mode .topbar{display:none}
body.embed-mode .side{display:none}
body.embed-mode .layout{display:block;min-height:100vh}
body.embed-mode .main{padding-top:18px}
</style>
</head>
<body>
<script>
/* embed mode detection */
if(location.search.includes('embed=1')) document.body.classList.add('embed-mode');
</script>


<!-- ========== Top Bar ========== -->
<div class="topbar">
  <div class="logo">泰小虎平台端</div>
  <div class="sys">会员中心 · 批量送券</div>
  <div class="right">🔔 👤 ⚙️</div>
</div>

<div class="layout">

<!-- ========== Sidebar ========== -->
<nav class="side">
  <div class="nav-group">
    <div class="gtitle"><span class="arr">▶</span> 营销应用</div>
    <div class="nav-body">
      <a class="indent">优惠券管理</a>
      <a class="indent">发券活动管理</a>
      <a class="indent">数据看板</a>
    </div>
  </div>
  <div class="nav-group open">
    <div class="gtitle"><span class="arr">▼</span> 会员管理</div>
    <div class="nav-body">
      <a class="indent active">会员中心</a>
      <a class="indent">会员列表</a>
      <a class="indent">用户券查询</a>
    </div>
  </div>
  <div class="nav-group">
    <div class="gtitle"><span class="arr">▶</span> 订单管理</div>
    <div class="nav-body">
      <a class="indent">订单列表</a>
    </div>
  </div>
  <div class="nav-group">
    <div class="gtitle"><span class="arr">▶</span> 系统</div>
    <div class="nav-body">
      <a class="indent">系统设置</a>
    </div>
  </div>
</nav>

<!-- ========== Main Content ========== -->
<main class="main">

<div class="crumb">会员管理 / <span>会员列表</span></div>

<!-- Filter -->
<div class="filter-bar">
  <span class="fb-label">手机号</span>
  <input placeholder="请输入手机号" id="fPhone">
  <span class="fb-label">用户ID</span>
  <input placeholder="请输入用户ID" id="fUserId">
  <span class="fb-label">用户昵称</span>
  <input placeholder="请输入用户昵称" id="fNick">
  <div class="filter-actions">
    <button class="btn-primary btn-sm" onclick="renderUsers()">搜索</button>
    <button class="btn-ghost btn-sm" onclick="resetFilter()">重置</button>
    <button class="btn-ghost btn-sm">展开</button>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn-primary btn-sm" id="btnBatchSend" onclick="openSendModal()" disabled>批量赠送</button>
    <button class="btn-ghost btn-sm" onclick="toast('请先勾选用户')">设置标签</button>
    <button class="btn-ghost btn-sm" onclick="toast('请先勾选用户')">加入黑名单</button>
  </div>
  <div class="toolbar-right">
    <button class="btn-ghost btn-sm" onclick="toast('导入功能开发中')">导入</button>
    <button class="btn-ghost btn-sm" onclick="toast('导出功能开发中')">导出</button>
  </div>
</div>

<!-- Table -->
<div class="tbl-wrap">
  <table class="tbl">
    <thead>
      <tr>
        <th class="chk"><input type="checkbox" id="chkAll" onclick="toggleAll()"></th>
        <th>客户信息</th>
        <th>用户ID</th>
        <th>会员等级</th>
        <th>储值余额(元)</th>
        <th>累计消费(元)</th>
        <th>最近消费时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="userTbody">
      <!-- JS rendered -->
    </tbody>
  </table>
</div>

<!-- Pagination -->
<div class="pagi">
  <span>共 <b id="totalCount">10</b> 条</span>
  <span>每页</span>
  <select id="pageSize"><option>20</option><option>50</option><option>100</option></select>
  <span>条</span>
  <button class="pg-btn">&lt;</button>
  <button class="pg-btn active">1</button>
  <button class="pg-btn">2</button>
  <button class="pg-btn">3</button>
  <button class="pg-btn">&gt;</button>
  <span>前往</span>
  <input value="1">
  <span>页</span>
</div>

</main>
</div>

<!-- ========== Send Coupon Modal ========== -->
<div class="modal-overlay" id="sendModal">
  <div class="modal-dlg">
    <div class="modal-header">
      <div class="modal-title">选择要赠送的优惠券</div>
      <button class="modal-close" onclick="closeSendModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="selected-bar">
        已选择 <span class="cp-count" id="selectedUserCount">0</span> 位用户，赠送后每人将获得 1 张所选优惠券
      </div>
      <div class="cp-search">
        <input placeholder="搜索优惠券名称" id="cpSearch" oninput="renderCouponOptions()">
        <button class="btn-primary btn-sm" onclick="renderCouponOptions()">搜索</button>
      </div>
      <div class="cp-list" id="couponList">
        <!-- JS rendered -->
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeSendModal()">取消</button>
      <button class="btn-primary" id="btnConfirmSend" onclick="confirmSend()" disabled>确定赠送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MOCK_USERS=[
  {id:'U6482',phone:'13739696492',nick:'U6482',level:'免费会员(VIP1)',balance:96110.00,total:3950.00,last:'2026-01-10 13:58:19'},
  {id:'U000001',phone:'18300000001',nick:'—',level:'免费会员(VIP1)',balance:10000.00,total:0.00,last:'2025-12-12 17:00:48'},
  {id:'U000002',phone:'19800000002',nick:'Summer001',level:'免费会员(VIP1)',balance:453.00,total:0.00,last:'2026-06-24 09:53:10'},
  {id:'U000003',phone:'19800000003',nick:'U383340',level:'免费会员(VIP1)',balance:0.00,total:0.00,last:'—'},
  {id:'U000004',phone:'19800000004',nick:'U25444X',level:'免费会员(VIP1)',balance:0.00,total:0.00,last:'2026-06-01 16:46:16'},
  {id:'U000005',phone:'19800000005',nick:'U88128',level:'免费会员(VIP1)',balance:0.00,total:0.00,last:'—'},
  {id:'U000006',phone:'19800000006',nick:'U386416',level:'免费会员(VIP1)',balance:0.00,total:0.00,last:'—'},
  {id:'U000007',phone:'19800000007',nick:'U703296',level:'免费会员(VIP1)',balance:0.00,total:0.00,last:'—'},
  {id:'U000008',phone:'19800000008',nick:'1111',level:'免费会员(VIP1)',balance:989021.00,total:788.00,last:'2025-12-11 09:34:37'},
  {id:'U000009',phone:'19800000009',nick:'U054326',level:'免费会员(VIP1)',balance:10000.00,total:0.00,last:'2025-11-27 12:01:07'},
];

const MOCK_COUPONS=[
  {id:'C1001',name:'新人专享满99减20',type:'满减券',rule:'满99减20',start:'2026-01-01',end:'2026-12-31',status:'启用'},
  {id:'C1002',name:'春节大促每满300减100',type:'满减券',rule:'每满300减100',start:'2026-01-15',end:'2026-02-15',status:'启用'},
  {id:'C1003',name:'臻享会员满500减80',type:'满减券',rule:'满500减80',start:'2026-01-01',end:'2026-06-30',status:'启用'},
  {id:'C1004',name:'已下架测试券',type:'满减券',rule:'满100减10',start:'2025-12-01',end:'2025-12-31',status:'下架'},
  {id:'C1005',name:'健康好物通用券',type:'满减券',rule:'满199减30',start:'2026-02-01',end:'2026-03-01',status:'启用'},
];

let selectedIds=new Set();
let selectedCouponId=null;

function $(id){return document.getElementById(id);}

function renderUsers(){
  const kwPhone=$('fPhone').value.trim();
  const kwId=$('fUserId').value.trim();
  const kwNick=$('fNick').value.trim();
  const filtered=MOCK_USERS.filter(u=>{
    if(kwPhone && !u.phone.includes(kwPhone)) return false;
    if(kwId && !u.id.toLowerCase().includes(kwId.toLowerCase())) return false;
    if(kwNick && !u.nick.toLowerCase().includes(kwNick.toLowerCase())) return false;
    return true;
  });
  $('totalCount').textContent=filtered.length;
  const tbody=$('userTbody');
  if(!filtered.length){
    tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:40px 0;color:#c0c4cc">暂无数据</td></tr>';
    return;
  }
  tbody.innerHTML=filtered.map(u=>{
    const checked=selectedIds.has(u.id)?'checked':'';
    return `<tr>
      <td class="chk"><input type="checkbox" ${checked} onchange="toggleUser('${u.id}',this.checked)"></td>
      <td>
        <div class="user-cell">
          <div class="user-avatar">${u.nick?u.nick[0]:'U'}</div>
          <div class="user-info">
            <div class="user-name">${u.nick||'—'}</div>
            <div class="user-phone">${u.phone}</div>
          </div>
        </div>
      </td>
      <td>${u.id}</td>
      <td><span class="tag tag-purple">${u.level}</span></td>
      <td>¥${u.balance.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td>¥${u.total.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td>${u.last}</td>
      <td class="act">
        <button class="btn-link" onclick="toast('验证码已发送')">验证码</button>
        <button class="btn-link" onclick="toast('查看用户 '+this.closest('tr').children[2].textContent)">查看</button>
        <button class="btn-link red" onclick="toast('更多操作')">更多</button>
      </td>
    </tr>`;
  }).join('');
  $('chkAll').checked=filtered.length>0 && filtered.every(u=>selectedIds.has(u.id));
  updateBatchBtn();
}

function toggleUser(id,checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  renderUsers();
}

function toggleAll(){
  const checked=$('chkAll').checked;
  const filtered=getFilteredUsers();
  filtered.forEach(u=>{if(checked) selectedIds.add(u.id); else selectedIds.delete(u.id);});
  renderUsers();
}

function getFilteredUsers(){
  const kwPhone=$('fPhone').value.trim();
  const kwId=$('fUserId').value.trim();
  const kwNick=$('fNick').value.trim();
  return MOCK_USERS.filter(u=>{
    if(kwPhone && !u.phone.includes(kwPhone)) return false;
    if(kwId && !u.id.toLowerCase().includes(kwId.toLowerCase())) return false;
    if(kwNick && !u.nick.toLowerCase().includes(kwNick.toLowerCase())) return false;
    return true;
  });
}

function updateBatchBtn(){
  $('btnBatchSend').disabled=selectedIds.size===0;
  $('btnBatchSend').textContent='批量赠送'+(selectedIds.size?` (${selectedIds.size})`:'');
}

function resetFilter(){
  $('fPhone').value='';
  $('fUserId').value='';
  $('fNick').value='';
  selectedIds.clear();
  renderUsers();
}

function openSendModal(){
  if(selectedIds.size===0){toast('请先选择用户',true);return;}
  $('selectedUserCount').textContent=selectedIds.size;
  selectedCouponId=null;
  $('cpSearch').value='';
  renderCouponOptions();
  $('sendModal').classList.add('show');
}

function closeSendModal(){
  $('sendModal').classList.remove('show');
}

function renderCouponOptions(){
  const kw=$('cpSearch').value.trim().toLowerCase();
  // 弹窗仅展示上架（启用）的券，下架/已删除券不出现
  const enabled=MOCK_COUPONS.filter(c=>c.status==='启用' && (!kw || c.name.toLowerCase().includes(kw) || c.rule.toLowerCase().includes(kw)));
  const list=$('couponList');
  if(!enabled.length){
    list.innerHTML='<div class="cp-empty">暂无符合条件的可用优惠券</div>';
    $('btnConfirmSend').disabled=true;
    return;
  }
  list.innerHTML=enabled.map(c=>{
    const selected=selectedCouponId===c.id;
    return `<div class="cp-item ${selected?'selected':''}" onclick="selectCoupon('${c.id}')">
      <div class="cp-radio"></div>
      <div class="cp-info">
        <div class="cp-name">${c.name} <span class="cp-tag enabled">${c.status}</span></div>
        <div class="cp-meta">
          <span>${c.type}</span>
          <span>${c.rule}</span>
          <span>有效期 ${c.start} ~ ${c.end}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  $('btnConfirmSend').disabled=!selectedCouponId;
}

function selectCoupon(id){
  selectedCouponId=id;
  renderCouponOptions();
}

function confirmSend(){
  if(!selectedCouponId){toast('请选择优惠券',true);return;}
  const coupon=MOCK_COUPONS.find(c=>c.id===selectedCouponId);
  toast(`已成功向 ${selectedIds.size} 位用户赠送「${coupon.name}」`);
  closeSendModal();
  selectedIds.clear();
  renderUsers();
}

function toast(msg,isErr){
  const t=$('toast');
  t.textContent=msg;
  t.className='toast show'+(isErr?' err':'');
  setTimeout(()=>t.classList.remove('show'),2500);
}

renderUsers();
</script>
</body>
</html>
