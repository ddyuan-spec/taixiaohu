<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=414,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>确认订单-选券核销</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:#e9e9ec;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 0}
.topbar{width:414px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topbar .title{font-size:15px;font-weight:600;color:#333}
.topbar .copy-btn{background:#5e4bfa;color:#fff;border:none;padding:7px 14px;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(94,75,250,.25)}
.topbar .copy-btn:active{transform:scale(.97)}
.phone{width:414px;height:820px;background:#1c1c1e;border-radius:48px;padding:14px;box-shadow:0 16px 48px rgba(0,0,0,.28);flex-shrink:0;position:relative;overflow:hidden}
.screen{width:386px;height:792px;background:#f7f8fa;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:28px;background:#1c1c1e;border-bottom-left-radius:16px;border-bottom-right-radius:16px;z-index:10}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px 6px;font-size:13px;color:#fff;font-weight:600;position:relative;z-index:5}
.statusbar .sb-right{display:flex;align-items:center;gap:6px}
.statusbar .sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.statusbar .sig i{width:3px;background:#fff;display:block;border-radius:1px}
.statusbar .sig i:nth-child(1){height:4px}.statusbar .sig i:nth-child(2){height:6px}.statusbar .sig i:nth-child(3){height:8px}.statusbar .sig i:nth-child(4){height:11px}
.statusbar .bat{width:22px;height:11px;border:1px solid #fff;border-radius:3px;position:relative;padding:1px}
.statusbar .bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#fff;border-radius:0 1px 1px 0}
.statusbar .bat i{display:block;height:100%;background:#fff;border-radius:1px;width:80%}
.nav{background:#fff;padding:13px 16px;display:flex;align-items:center;position:relative;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.nav-back{font-size:24px;color:#333;width:28px;cursor:default;line-height:1}
.nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:#333;margin-right:28px}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:80px}
.card{background:#fff;border-radius:12px;margin-bottom:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-title{font-size:14px;font-weight:700;color:#333;margin-bottom:10px}
.addr-row{display:flex;align-items:flex-start;gap:10px}
.addr-icon{width:22px;height:22px;background:#5e4bfa;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0;margin-top:2px}
.addr-info{flex:1}
.addr-name{font-size:15px;font-weight:600;color:#333}
.addr-phone{font-size:13px;color:#999;margin-left:6px}
.addr-txt{font-size:13px;color:#666;margin-top:4px;line-height:1.5}
.store{font-size:12px;color:#999;margin-bottom:8px}
.product{display:flex;align-items:center}
.product .thumb{width:60px;height:60px;background:#f5f5f5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-right:12px;flex-shrink:0}
.product .info{flex:1}
.product .info .name{font-size:15px;font-weight:600;color:#333}
.product .info .spec{font-size:12px;color:#999;margin-top:4px}
.product .price{font-size:15px;font-weight:600;color:#333;flex-shrink:0}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:14px}
.summary-row .k{color:#666}
.summary-row .v{color:#333}
.summary-row .v.red{color:#f5222d;font-weight:600}
.divider{height:1px;background:#f0f0f0;margin:8px 0}
/* 优惠券入口行 */
.coupon-entry{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden}
.ce-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
.ce-title{font-size:15px;font-weight:600;color:#333}
.ce-right{display:flex;align-items:center;gap:8px}
.ce-info{font-size:14px;color:#f5222d;font-weight:600}
.ce-arrow{font-size:18px;color:#999}
/* 底部弹窗 */
.popup-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;opacity:0;transition:opacity .25s}
.popup-overlay.show{display:block;opacity:1}
.popup-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top-left-radius:20px;border-top-right-radius:20px;z-index:21;transform:translateY(100%);transition:transform .25s;max-height:72%;display:flex;flex-direction:column}
.popup-sheet.show{transform:translateY(0)}
.popup-handle{width:36px;height:5px;background:#ddd;border-radius:3px;margin:10px auto 6px}
.popup-title{text-align:center;font-size:17px;font-weight:600;color:#333;margin-bottom:10px}
.popup-list{flex:1;overflow-y:auto;padding:12px 16px 16px}
.coupon-card{display:flex;align-items:stretch;background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden;border:1px solid #f5f5f5;cursor:pointer}
.coupon-card.selected{border-color:#ff4d4f}
.coupon-card.disabled{opacity:.55;background:#f9f9f9}
.cc-left{width:88px;background:linear-gradient(135deg,#ff6b35,#ff4d4f);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:10px 0}
.cc-left .amt{font-size:26px;font-weight:700}
.cc-left .amt small{font-size:14px;font-weight:600}
.cc-left .rule{font-size:11px;margin-top:4px;opacity:.95}
.cc-mid{flex:1;padding:12px;display:flex;flex-direction:column;justify-content:center}
.cc-name{font-size:15px;font-weight:600;color:#333;line-height:1.3}
.cc-row{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.cc-exp{font-size:12px;color:#999}
.cc-hold{font-size:11px;color:#5e4bfa;background:#f0edff;border-radius:4px;padding:1px 6px;margin-left:6px}
.cc-rule{font-size:12px;color:#5e4bfa}
.cc-reason{font-size:11px;color:#cf1322;margin-top:8px;background:#fff1f0;border:1px solid #ffa39e;border-radius:6px;padding:6px 8px;line-height:1.45;display:flex;align-items:center;gap:4px}
.cc-tag{font-size:10px;color:#fff;background:#ff4d4f;border-radius:4px;padding:1px 5px}
.cc-right{width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px dashed #f0f0f0;flex-shrink:0;gap:8px}
.cc-radio{width:20px;height:20px;border:2px solid #ccc;border-radius:50%;position:relative}
.cc-radio.on{border-color:#ff4d4f;background:#ff4d2f}
.cc-radio.on::after{content:'';position:absolute;left:4px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cc-stepper{display:flex;align-items:center;gap:6px}
.cc-stepper button{width:22px;height:22px;border:1px solid #ddd;background:#fff;border-radius:50%;font-size:14px;color:#666;line-height:1;display:flex;align-items:center;justify-content:center}
.cc-stepper button:disabled{border-color:#eee;color:#ccc}
.cc-stepper span{font-size:14px;font-weight:600;color:#333;min-width:18px;text-align:center}
.no-coupon{display:flex;align-items:center;padding:14px 0;cursor:pointer}
.no-coupon .radio{width:20px;height:20px;border:2px solid #ccc;border-radius:50%;margin-right:12px;position:relative}
.no-coupon .radio.on{border-color:#ff4d4f;background:#ff4d2f}
.no-coupon .radio.on::after{content:'';position:absolute;left:4px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.no-coupon .txt{font-size:15px;color:#666}
/* 底部提交栏 */
.bottom-bar{position:absolute;bottom:0;left:0;right:0;background:#fff;padding:10px 16px;border-top:1px solid #eee;display:flex;align-items:center;justify-content:space-between;z-index:8}
.bottom-bar .total{font-size:14px;color:#333}
.bottom-bar .total b{font-size:20px;color:#f5222d;margin-left:4px}
.bottom-bar .save{font-size:12px;color:#f5222d;margin-left:6px}
.bottom-bar .submit{background:#5e4bfa;color:#fff;border:none;padding:11px 28px;border-radius:22px;font-size:15px;font-weight:600;cursor:pointer}
.bottom-bar .submit:active{transform:scale(.97)}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:100;max-width:80%;text-align:center}
</style>
</head>
<body>

<div class="topbar">
  <span class="title">确认订单 · 选券 / 核销</span>
  <button class="copy-btn" onclick="copySource()">复制源码</button>
</div>

<div class="phone" id="phone">
  <div class="screen">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-right">
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="bat"><i></i></span>
      </span>
    </div>
    <div class="nav">
      <span class="nav-back">‹</span>
      <span class="nav-title">确认订单</span>
    </div>

    <div class="content">

      <!-- 收货地址 -->
      <div class="card">
        <div class="addr-row">
          <div class="addr-icon">📍</div>
          <div class="addr-info">
            <div class="addr-name">张小虎<span class="addr-phone">13712349042</span></div>
            <div class="addr-txt">浙江省杭州市余杭区文一西路 969 号 泰小虎健康大厦 8 楼</div>
          </div>
        </div>
      </div>

      <!-- 商品 -->
      <div class="card">
        <div class="store">泰小虎健康旗舰店</div>
        <div class="product">
          <div class="thumb">🦐</div>
          <div class="info">
            <div class="name">虾-泰香脆Q56</div>
            <div class="spec">规格：56g 单盒</div>
          </div>
          <div class="price">¥239.00</div>
        </div>
      </div>

      <!-- 价格摘要 -->
      <div class="card">
        <div class="summary-row">
          <span class="k">商品总价</span>
          <span class="v" id="goodsTotal">¥239.00</span>
        </div>
        <div class="summary-row">
          <span class="k">运费</span>
          <span class="v">¥0.00</span>
        </div>
      </div>

      <!-- 优惠券入口 -->
      <div class="coupon-entry" id="couponEntry" onclick="openCouponPopup()">
        <div class="ce-head">
          <span class="ce-title">优惠券</span>
          <div class="ce-right">
            <span class="ce-info" id="couponBrief">-¥30.00</span>
            <span class="ce-arrow">›</span>
          </div>
        </div>
      </div>

      <!-- 优惠明细 -->
      <div class="card">
        <div class="summary-row">
          <span class="k">优惠券抵扣</span>
          <span class="v red" id="couponDiscount">-¥30.00</span>
        </div>
        <div class="divider"></div>
        <div class="summary-row">
          <span class="k">实付金额</span>
          <span class="v red" id="payAmount">¥209.00</span>
        </div>
      </div>

    </div>

    <!-- 底部提交栏 -->
    <div class="bottom-bar">
      <div class="total">实付<b id="bottomTotal">¥209.00</b><span class="save" id="bottomSave">已省¥30.00</span></div>
      <button class="submit" onclick="submitOrder()">提交订单</button>
    </div>

  </div>

  <!-- 优惠券选择弹窗 -->
  <div class="popup-overlay" id="popupOverlay" onclick="closeCouponPopup()"></div>
  <div class="popup-sheet" id="popupSheet">
    <div class="popup-handle"></div>
    <div class="popup-title">优惠券</div>
    <div class="popup-list" id="popupList">
      <!-- 由 JS 渲染 -->
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var goodsTotal=239;
var coupons=[
  {id:1,name:'福利直播满100减10',amt:10,threshold:100,exp:'2026-08-18',expList:['2026-08-18','2026-08-20','2026-08-25'],hold:3,multi:true,usable:true,obtain:'2026-08-01',reason:''},
  {id:2,name:'新人满99减20',amt:20,threshold:99,exp:'2026-08-15',multi:false,usable:true,obtain:'2026-08-02',reason:''},
  {id:3,name:'会员日满200减30',amt:30,threshold:200,exp:'2026-08-19',multi:false,usable:true,obtain:'2026-08-03',reason:''},
  {id:4,name:'老客回馈无门槛10元',amt:10,threshold:0,exp:'2026-08-21',multi:false,usable:false,obtain:'2026-08-04',reason:'仅限（App / H5）可使用'},
  {id:5,name:'满50减5',amt:5,threshold:50,exp:'2026-08-22',expList:['2026-08-22','2026-08-25'],hold:2,multi:true,usable:true,obtain:'2026-08-04',reason:''},
  {id:6,name:'指定商品满80减15',amt:15,threshold:80,exp:'2026-08-30',multi:false,usable:false,obtain:'2026-08-05',reason:'仅限「虾-泰香脆Q56」可使用'},
  {id:7,name:'老客回馈满100减10',amt:10,threshold:100,exp:'2026-08-14',multi:false,usable:true,obtain:'2026-08-07',reason:''},
  {id:8,name:'指定店铺满150减25',amt:25,threshold:150,exp:'2026-09-01',multi:false,usable:false,obtain:'2026-08-06',reason:'仅限「泰小虎健康旗舰店」可使用'},
  {id:9,name:'满300减40',amt:40,threshold:300,exp:'2026-09-05',multi:false,usable:false,obtain:'2026-08-08',reason:'订单金额不足，还差¥61元可用'}
];
var quantities={}; // id -> count
coupons.forEach(function(c){quantities[c.id]=1;});
var selectedId=defaultSelectedId(); // 默认选中排序后第一张券（首位可用券）

function formatMoney(n){return '¥'+n.toFixed(2);}
function currentCoupon(){return coupons.find(function(c){return c.id==selectedId;});}
function effectiveDiscountOf(c){
  if(!c||!c.usable)return 0;
  var q=quantities[c.id]||1;
  if(c.multi){
    // 逐张门槛重判简化：最多可用张数受剩余实付限制
    var remain=goodsTotal,total=0,i;
    for(i=0;i<q;i++){
      if(remain>=c.threshold){total+=c.amt;remain-=c.amt;}
      else break;
    }
    return total;
  }
  return (goodsTotal>=c.threshold||c.threshold===0)?c.amt:0;
}
function effectiveDiscount(){return effectiveDiscountOf(currentCoupon());}
function defaultSelectedId(){
  // 默认选中排序后第一张券：可用券整体排前，故首位即首位可用券；无可用券则返回 0（不使用优惠券）
  var sorted=coupons.slice().sort(sortCoupons);
  var first=sorted[0];
  return (first&&first.usable)?first.id:0;
}
function sortCoupons(a,b){
  // 第一级：可用券整体排在不可用券之前
  if(a.usable!==b.usable) return a.usable?-1:1;
  if(a.usable){
    // 可用券组内：优惠金额降序（主）→ 叠加优先 → 到期倒序 → 获得倒序
    var da=effectiveDiscountOf(a), db=effectiveDiscountOf(b);
    if(da!==db) return db-da;
    if(a.multi!==b.multi) return a.multi?-1:1;
    if(a.exp!==b.exp) return a.exp<b.exp?1:-1;
    return a.obtain<b.obtain?1:-1;
  }
  // 不可用券组内：叠加优先（主）→ 同金额按到期倒序 → 同到期按获得倒序
  if(a.multi!==b.multi) return a.multi?-1:1;
  if(a.exp!==b.exp) return a.exp<b.exp?1:-1;
  return a.obtain<b.obtain?1:-1;
}
function updateAmounts(){
  var discount=effectiveDiscount();
  var pay=goodsTotal-discount;
  document.getElementById('couponDiscount').textContent='-'+formatMoney(discount);
  document.getElementById('payAmount').textContent=formatMoney(pay);
  document.getElementById('bottomTotal').textContent=formatMoney(pay);
  document.getElementById('bottomSave').textContent='已省'+formatMoney(discount);
  document.getElementById('couponBrief').textContent=selectedId?'-'+formatMoney(discount):'未使用';
}
function renderPopupList(){
  var list=document.getElementById('popupList');
  var sorted=coupons.slice().sort(sortCoupons);
  var html='';
  sorted.forEach(function(c){
    var isSel=c.id==selectedId;
    var disabled=!c.usable;
    html+='<div class="coupon-card '+(isSel?'selected':'')+(disabled?' disabled':'')+'" onclick="selectCoupon('+c.id+','+disabled+')">';
    html+='<div class="cc-left"><div class="amt"><small>¥</small>'+c.amt+'</div><div class="rule">'+(c.threshold?('满'+c.threshold):'无门槛')+'</div></div>';
    html+='<div class="cc-mid">';
    html+='<div class="cc-name">'+c.name+'</div>';
    var expHtml='<span class="cc-exp">有效期至 '+c.exp+'</span>'+(c.multi&&c.hold>1?'<span class="cc-hold">本次可用 '+c.hold+' 张</span>':'');
    html+='<div class="cc-row">'+expHtml+(isSel&&c.usable?'<span class="cc-tag">推荐</span>':'')+'</div>';
    if(c.usable) html+='<div class="cc-row"><span class="cc-rule">券规则›</span></div>';
    if(c.reason) html+='<div class="cc-reason">⚠️ '+c.reason+'</div>';
    html+='</div>';
    html+='<div class="cc-right">';
    html+='<div class="cc-radio '+(isSel?'on':'')+'"></div>';
    if(isSel&&c.multi&&c.usable){
      html+='<div class="cc-stepper"><button onclick="event.stopPropagation();changeQty('+c.id+',-1)">−</button><span>'+(quantities[c.id]||1)+'</span><button onclick="event.stopPropagation();changeQty('+c.id+',1)">+</button></div>';
    }
    html+='</div></div>';
  });
  html+='<div class="no-coupon" onclick="noCoupon()"><div class="radio '+(selectedId?'':'on')+'"></div><span class="txt">不使用优惠券</span></div>';
  list.innerHTML=html;
}
function openCouponPopup(){
  document.getElementById('popupOverlay').classList.add('show');
  document.getElementById('popupSheet').classList.add('show');
  renderPopupList();
}
function closeCouponPopup(){
  document.getElementById('popupOverlay').classList.remove('show');
  document.getElementById('popupSheet').classList.remove('show');
}
function selectCoupon(id,disabled){
  if(disabled){
    var c=coupons.find(function(x){return x.id==id;});
    showToast(c.reason||'当前不可用');
    return;
  }
  selectedId=id;
  quantities[id]=quantities[id]||1;
  updateAmounts();
  renderPopupList();
}
function changeQty(id,delta){
  var c=coupons.find(function(x){return x.id==id;});
  var q=quantities[id]||1;
  var max=Math.min(5,Math.floor(goodsTotal/c.threshold||1)); // 简化上限
  var newQ=q+delta;
  if(newQ<1)return;
  if(newQ>max){showToast('本券在本单已达可用上限');return;}
  quantities[id]=newQ;
  updateAmounts();
  renderPopupList();
}
function noCoupon(){
  selectedId=0;
  updateAmounts();
  renderPopupList();
}
function submitOrder(){
  if(selectedId){
    var c=currentCoupon();
    showToast('提交订单并预占券：'+c.name+'\n应付 ¥'+(goodsTotal-effectiveDiscount()).toFixed(2));
  }else{
    showToast('提交订单，不使用优惠券\n应付 ¥'+goodsTotal.toFixed(2));
  }
}
function showToast(txt){
  var t=document.getElementById('toast');
  t.textContent=txt;t.style.display='block';
  setTimeout(function(){t.style.display='none';},2000);
}
function fallbackCopy(src,ok,fail){
  var ta=document.createElement('textarea');
  ta.value=src;
  ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');ok();}catch(e){fail();}
  document.body.removeChild(ta);
}
/* ===== 平铺源码：确认订单整页 + 优惠券弹窗（不区分类型 · 统一列表）===== */
function renderFlatListHTML(){
  var sorted=coupons.slice().sort(sortCoupons);
  var h='<div style="font-size:13px;font-weight:700;color:#333;margin:16px 0 8px;padding-left:6px;border-left:3px solid #5e4bfa;">优惠券（不区分类型 · 统一列表）</div>';
  sorted.forEach(function(c){
    var isSel=c.id==selectedId;
    var disabled=!c.usable;
    h+='<div class="coupon-card '+(isSel?'selected':'')+(disabled?' disabled':'')+'">';
    h+='<div class="cc-left"><div class="amt"><small>¥</small>'+c.amt+'</div><div class="rule">'+(c.threshold?('满'+c.threshold):'无门槛')+'</div></div>';
    h+='<div class="cc-mid">';
    h+='<div class="cc-name">'+c.name+'</div>';
    var expHtml='<span class="cc-exp">有效期至 '+c.exp+'</span>'+(c.multi&&c.hold>1?'<span class="cc-hold">本次可用 '+c.hold+' 张</span>':'');
    h+='<div class="cc-row">'+expHtml+(isSel&&c.usable?'<span class="cc-tag">推荐</span>':'')+'</div>';
    if(c.usable) h+='<div class="cc-row"><span class="cc-rule">券规则›</span></div>';
    if(c.reason) h+='<div class="cc-reason">⚠️ '+c.reason+'</div>';
    h+='</div>';
    h+='<div class="cc-right"><div class="cc-radio '+(isSel?'on':'')+'"></div></div>';
    h+='</div>';
  });
  h+='<div class="no-coupon"><div class="radio '+(selectedId?'':'on')+'"></div><span class="txt">不使用优惠券</span></div>';
  return h;
}
function copySource(){
  // 复制「确认订单整页」源码：页面其它元素齐全，券弹窗展开，统一列表（不区分类型）
  var phone=document.getElementById('phone').cloneNode(true);
  phone.querySelectorAll('script').forEach(function(s){s.remove();});
  phone.removeAttribute('id');
  phone.style.height='auto';
  phone.style.overflow='visible';
  var ov=phone.querySelector('.popup-overlay'); if(ov){ov.style.display='none';}
  var sheet=phone.querySelector('.popup-sheet');
  sheet.classList.add('show');
  sheet.style.position='relative';
  sheet.style.transform='none';
  sheet.style.maxHeight='none';
  sheet.style.marginTop='16px';
  var list=phone.querySelector('#popupList');
  list.innerHTML=renderFlatListHTML();
  list.style.overflow='visible';
  list.style.maxHeight='none';
  var styleText=document.querySelector('head style').textContent;
  var payload='<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>确认订单·选券 平铺（弹窗展开·统一列表）</title>\n<style>'+styleText+'</style>\n</head>\n<body>\n'+phone.outerHTML+'\n</body>\n</html>';
  function ok(){showToast('已复制平铺源码（整页+弹窗统一列表）');}
  function fail(){showToast('复制失败，请手动复制');}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(ok,function(){fallbackCopy(payload,ok,fail);});
  }else{
    fallbackCopy(payload,ok,fail);
  }
}
updateAmounts();
