<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=414,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的优惠券-已过期</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:#e9e9ec;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 0}
.topbar{width:414px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topbar .title{font-size:15px;font-weight:600;color:#333}
.topbar .copy-btn{background:#00c853;color:#fff;border:none;padding:7px 14px;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,200,83,.25)}
.topbar .copy-btn:active{transform:scale(.97)}
.phone{width:414px;height:820px;background:#1c1c1e;border-radius:48px;padding:14px;box-shadow:0 16px 48px rgba(0,0,0,.28);flex-shrink:0}
.screen{width:386px;height:792px;background:#f7f8fa;border-radius:36px;overflow:hidden;position:relative}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:28px;background:#1c1c1e;border-bottom-left-radius:16px;border-bottom-right-radius:16px;z-index:10}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px 6px;font-size:13px;color:#222;font-weight:600}
.statusbar .sb-right{display:flex;align-items:center;gap:6px}
.statusbar .sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.statusbar .sig i{width:3px;background:#222;display:block;border-radius:1px}
.statusbar .sig i:nth-child(1){height:4px}.statusbar .sig i:nth-child(2){height:6px}.statusbar .sig i:nth-child(3){height:8px}.statusbar .sig i:nth-child(4){height:11px}
.statusbar .bat{width:22px;height:11px;border:1px solid #222;border-radius:3px;position:relative;padding:1px}
.statusbar .bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#222;border-radius:0 1px 1px 0}
.statusbar .bat i{display:block;height:100%;background:#222;border-radius:1px;width:80%}
.nav{background:#fff;padding:13px 16px;display:flex;align-items:center;border-bottom:1px solid #f0f0f0}
.nav-back{font-size:24px;color:#333;width:28px;cursor:default;line-height:1}
.nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:#333;margin-right:28px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee}
.tabs span{flex:1;text-align:center;padding:14px 0;font-size:14px;color:#999;position:relative}
.tabs span.active{color:#00c853;font-weight:600}
.tabs span.active::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:28px;height:3px;background:#00c853;border-radius:2px}
.content{height:calc(100% - 122px);overflow-y:auto;padding:12px 12px 24px}
.coupon{display:flex;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer}
.coupon .left{width:108px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0;background:#00c853;position:relative}
.coupon .left .amt{font-size:38px;font-weight:700;line-height:1}
.coupon .left .amt sub{font-size:14px;font-weight:500;vertical-align:baseline;margin-right:2px}
.coupon .left .cond{font-size:11px;margin-top:6px;opacity:.9}
.coupon .right{flex:1;padding:13px 14px;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:112px}
.coupon .right .cname{font-size:16px;font-weight:700;color:#222;line-height:1.3}
.coupon .right .crow{font-size:13px;color:#999;margin-top:5px;line-height:1.5}
.coupon .right .crow.expire{color:#666}
.coupon .right .tag{position:absolute;top:12px;right:14px;font-size:11px;border-radius:10px;padding:2px 7px}
.coupon .right .btn-rule{position:absolute;right:14px;bottom:12px;font-size:13px;color:#00c853;font-weight:600}
/* 已过期态 */
.coupon.expired .left{background:#c0c0c0}
.coupon.expired .right .cname{color:#999}
.coupon.expired .right .crow{color:#bbb}
.coupon.expired .right .crow.expire{color:#bbb}
.coupon.expired .right .tag{background:#f0f0f0;color:#999;border:1px solid #e0e0e0}
/* 底部弹窗 sheet */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:20px 18px 28px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .sh-title{font-size:16px;font-weight:700;color:#222;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.sheet .sh-close{font-size:22px;color:#999;cursor:pointer;line-height:1}
.sheet .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:14px}
.sheet .row .k{color:#999;flex-shrink:0}
.sheet .row .v{color:#333;font-weight:600;text-align:right;max-width:62%}
.sheet .rule-txt{font-size:13px;color:#888;line-height:1.7;margin-top:15px;background:#f7f8fa;border-radius:10px;padding:12px}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:100;max-width:80%;text-align:center}
</style>
</head>
<body>

<div class="topbar">
  <span class="title">我的优惠券 · 已过期状态</span>
  <button class="copy-btn" onclick="copySource()">复制源码</button>
</div>

<div class="phone">
  <div class="screen">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-right">
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="bat"><i></i></span>
      </span>
    </div>
    <div class="nav">
      <span class="nav-back">‹</span>
      <span class="nav-title">我的优惠券</span>
    </div>
    <div class="tabs">
      <span>未使用</span>
      <span>已使用</span>
      <span class="active">已过期</span>
    </div>
    <div class="content">

      <!-- 已过期券1 -->
      <div class="coupon expired" onclick="openDetail(this)" data-name="会员日满200减30" data-amt="¥30" data-cond="满200元可用" data-scope="全场通用" data-expire="2026-07-31 23:59">
        <div class="left">
          <span class="amt"><sub>¥</sub>30</span>
          <span class="cond">满200元可用</span>
        </div>
        <div class="right">
          <span class="tag">已过期</span>
          <div class="cname">会员日满200减30</div>
          <div class="crow">适用：全场通用</div>
          <div class="crow expire">过期时间：2026-07-31 23:59</div>
          <span class="btn-rule">券规则 ›</span>
        </div>
      </div>

      <!-- 已过期券2 -->
      <div class="coupon expired" onclick="openDetail(this)" data-name="新人立减15元" data-amt="¥15" data-cond="无门槛" data-scope="指定商品" data-expire="2026-07-28 23:59">
        <div class="left">
          <span class="amt"><sub>¥</sub>15</span>
          <span class="cond">无门槛</span>
        </div>
        <div class="right">
          <span class="tag">已过期</span>
          <div class="cname">新人立减15元</div>
          <div class="crow">适用：指定商品</div>
          <div class="crow expire">过期时间：2026-07-28 23:59</div>
          <span class="btn-rule">券规则 ›</span>
        </div>
      </div>

      <!-- 已过期券3 -->
      <div class="coupon expired" onclick="openDetail(this)" data-name="满99减10" data-amt="¥10" data-cond="满99元可用" data-scope="全场通用" data-expire="2026-07-22 23:59">
        <div class="left">
          <span class="amt"><sub>¥</sub>10</span>
          <span class="cond">满99元可用</span>
        </div>
        <div class="right">
          <span class="tag">已过期</span>
          <div class="cname">满99减10</div>
          <div class="crow">适用：全场通用</div>
          <div class="crow expire">过期时间：2026-07-22 23:59</div>
          <span class="btn-rule">券规则 ›</span>
        </div>
      </div>

    </div>

    <!-- 券规则 / 过期详情弹窗 -->
    <div class="overlay" id="overlay" onclick="if(event.target===this)closeDetail()">
      <div class="sheet">
        <div class="sh-title"><span>券规则 · 已过期</span><span class="sh-close" onclick="closeDetail()">×</span></div>
        <div class="row"><span class="k">券名称</span><span class="v" id="d-name"></span></div>
        <div class="row"><span class="k">面额 / 门槛</span><span class="v" id="d-amt"></span></div>
        <div class="row"><span class="k">适用范围</span><span class="v" id="d-scope"></span></div>
        <div class="row"><span class="k">过期时间</span><span class="v" id="d-expire"></span></div>
        <div class="rule-txt">该券已过有效期，状态为「已过期」，不可再用于下单或抵扣。已过期券保留展示 30 天后自动归档。</div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function openDetail(el){
  document.getElementById('d-name').textContent=el.dataset.name;
  document.getElementById('d-amt').textContent=el.dataset.amt+' · '+el.dataset.cond;
  document.getElementById('d-scope').textContent=el.dataset.scope;
  document.getElementById('d-expire').textContent=el.dataset.expire;
  document.getElementById('overlay').classList.add('show');
}
function closeDetail(){document.getElementById('overlay').classList.remove('show');}
function fallbackCopy(src,ok,fail){
  var ta=document.createElement('textarea');
  ta.value=src;
  ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');ok();}catch(e){fail();}
  document.body.removeChild(ta);
}
function copySource(){
  var src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  function ok(){showToast('已复制完整源码');}
  function fail(){showToast('复制失败，请手动复制');}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(src).then(ok,function(){fallbackCopy(src,ok,fail);});
  }else{
    fallbackCopy(src,ok,fail);
  }
}
function showToast(txt){
  var t=document.getElementById('toast');
  t.textContent=txt;t.style.display='block';
  setTimeout(function(){t.style.display='none';},1800);
}
</script>
</body>
</html>
