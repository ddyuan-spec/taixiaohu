<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" font-family="'Microsoft YaHei','PingFang SC','Heiti SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#555"></path>
    </marker>
  </defs>

  <text x="530" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">泰小虎 · 睡眠任务闭环业务流程架构</text>

  <!-- 泳道背景 -->
  <rect x="20" y="52" width="1020" height="158" fill="#eaf3fb" stroke="#bcd6ec"></rect>
  <rect x="20" y="216" width="1020" height="150" fill="#f3f0fb" stroke="#d6cdec"></rect>
  <rect x="20" y="376" width="1020" height="158" fill="#fbf3ea" stroke="#ecd6bc"></rect>

  <!-- 泳道标签 -->
  <text x="34" y="76" font-size="15" font-weight="bold" fill="#2b6cb0">用户端（C端）</text>
  <text x="34" y="240" font-size="15" font-weight="bold" fill="#6b46c1">服务端（任务引擎）</text>
  <text x="34" y="400" font-size="15" font-weight="bold" fill="#c05621">平台端后台（运营配置）</text>

  <!-- ===== 节点 ===== -->
  <!-- 用户端 行1 y=96 -->
  <rect x="150" y="96" width="150" height="50" rx="8" fill="#ffffff" stroke="#2b6cb0"></rect>
  <text x="225" y="126" text-anchor="middle" font-size="13" fill="#222">收到PUSH/通知</text>

  <rect x="330" y="96" width="150" height="50" rx="8" fill="#ffffff" stroke="#2b6cb0"></rect>
  <text x="405" y="126" text-anchor="middle" font-size="13" fill="#222">进首页/弹窗</text>

  <rect x="510" y="96" width="150" height="50" rx="8" fill="#ffffff" stroke="#2b6cb0"></rect>
  <text x="585" y="126" text-anchor="middle" font-size="13" fill="#222">进我的睡眠</text>

  <rect x="690" y="96" width="150" height="50" rx="8" fill="#ffffff" stroke="#2b6cb0"></rect>
  <text x="765" y="126" text-anchor="middle" font-size="13" fill="#222">领取/健康打卡</text>

  <rect x="870" y="96" width="150" height="50" rx="8" fill="#ffffff" stroke="#2b6cb0"></rect>
  <text x="945" y="126" text-anchor="middle" font-size="13" fill="#222">每日完成任务</text>

  <!-- 用户端 行2 y=158 -->
  <rect x="690" y="158" width="150" height="50" rx="8" fill="#ffffff" stroke="#2b6cb0"></rect>
  <text x="765" y="188" text-anchor="middle" font-size="13" fill="#222">完成弹窗·分享</text>

  <rect x="870" y="158" width="150" height="50" rx="8" fill="#ffffff" stroke="#2b6cb0"></rect>
  <text x="945" y="188" text-anchor="middle" font-size="13" fill="#222">领取虎力值</text>

  <!-- 服务端 y=262 -->
  <rect x="150" y="262" width="150" height="50" rx="8" fill="#ffffff" stroke="#6b46c1"></rect>
  <text x="225" y="280" text-anchor="middle" font-size="12" fill="#222">每日 06:00</text>
  <text x="225" y="298" text-anchor="middle" font-size="12" fill="#222">触发 PUSH</text>

  <rect x="330" y="262" width="150" height="50" rx="8" fill="#ffffff" stroke="#6b46c1"></rect>
  <text x="405" y="280" text-anchor="middle" font-size="12" fill="#222">每日 03:00</text>
  <text x="405" y="298" text-anchor="middle" font-size="12" fill="#222">触发 重置</text>

  <rect x="510" y="262" width="150" height="50" rx="8" fill="#ffffff" stroke="#6b46c1"></rect>
  <text x="585" y="292" text-anchor="middle" font-size="13" fill="#222">任务下发引擎</text>

  <rect x="690" y="262" width="150" height="50" rx="8" fill="#ffffff" stroke="#6b46c1"></rect>
  <text x="765" y="280" text-anchor="middle" font-size="12" fill="#222">打卡校验</text>
  <text x="765" y="298" text-anchor="middle" font-size="12" fill="#222">+发虎力值</text>

  <rect x="870" y="262" width="150" height="50" rx="8" fill="#ffffff" stroke="#6b46c1"></rect>
  <text x="945" y="292" text-anchor="middle" font-size="13" fill="#222">生成睡眠日报</text>

  <!-- 平台端后台 y=424 -->
  <rect x="150" y="424" width="150" height="50" rx="8" fill="#ffffff" stroke="#c05621"></rect>
  <text x="225" y="454" text-anchor="middle" font-size="13" fill="#222">任务模板配置</text>

  <rect x="330" y="424" width="150" height="50" rx="8" fill="#ffffff" stroke="#c05621"></rect>
  <text x="405" y="442" text-anchor="middle" font-size="13" fill="#222">候选任务池</text>
  <text x="405" y="460" text-anchor="middle" font-size="12" fill="#222">(inPool)</text>

  <rect x="510" y="424" width="150" height="50" rx="8" fill="#ffffff" stroke="#c05621"></rect>
  <text x="585" y="454" text-anchor="middle" font-size="13" fill="#222">固定首批规则</text>


  <rect x="870" y="424" width="150" height="50" rx="8" fill="#ffffff" stroke="#c05621"></rect>
  <text x="945" y="454" text-anchor="middle" font-size="13" fill="#222">数据监控漏斗</text>

  <!-- ===== 同泳道箭头 ===== -->
  <line x1="300" y1="121" x2="328" y2="121" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="480" y1="121" x2="508" y2="121" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="660" y1="121" x2="688" y2="121" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="840" y1="121" x2="868" y2="121" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="945" y1="146" x2="945" y2="156" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="840" y1="183" x2="868" y2="183" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>

  <line x1="480" y1="287" x2="508" y2="287" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="660" y1="287" x2="688" y2="287" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="840" y1="287" x2="868" y2="287" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>

  <line x1="300" y1="449" x2="328" y2="449" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="480" y1="449" x2="508" y2="449" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="660" y1="449" x2="688" y2="449" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>
  <line x1="840" y1="449" x2="868" y2="449" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"></line>

  <!-- ===== 跨泳道箭头 ===== -->
  <!-- 06:00 PUSH -> C端 收到PUSH/通知 -->
  <line x1="225" y1="262" x2="225" y2="148" stroke="#6b46c1" stroke-width="1.6" marker-end="url(#arr)"></line>
  <!-- S2 -> N4 (任务下发) -->
  <line x1="585" y1="262" x2="765" y2="148" stroke="#6b46c1" stroke-width="1.6" marker-end="url(#arr)"></line>
  <!-- N5 -> S3 (完成任务上报) -->
  <line x1="945" y1="146" x2="765" y2="262" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#arr)"></line>
  <!-- S3 -> N7 (发虎力值) -->
  <line x1="765" y1="312" x2="945" y2="158" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#arr)"></line>
  <!-- P3 -> S2 (规则驱动) -->
  <line x1="585" y1="424" x2="585" y2="312" stroke="#c05621" stroke-width="1.6" marker-end="url(#arr)"></line>
  <!-- S3 -> P5 (数据回流) -->
  <line x1="765" y1="312" x2="945" y2="424" stroke="#c05621" stroke-width="1.6" marker-end="url(#arr)"></line>

  <!-- 图例 -->
  <text x="34" y="600" font-size="12" fill="#666">说明：蓝=用户端动作，紫=服务端任务引擎，橙=后台运营配置；竖向箭头为跨层驱动/回流，横向箭头为同层流转。</text>
</svg>
