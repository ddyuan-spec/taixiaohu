<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的优惠券-未使用</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:#f5f5f5;max-width:375px;margin:0 auto;min-height:100vh}
/* 顶栏 */
.nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:14px 16px;text-align:center;font-size:17px;font-weight:600;color:#333}
/* 券卡片 */
.list{padding:12px}
.coupon{display:flex;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.coupon .left{width:105px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.coupon .left .amt{font-size:34px;font-weight:700;line-height:1.1}
.coupon .left .amt sub{font-size:13px;font-weight:400;vertical-align:baseline}
.coupon .left .cond{font-size:11px;margin-top:2px;opacity:.85}
.coupon .right{flex:1;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.coupon .right .cname{font-size:15px;font-weight:600;color:#333;line-height:1.3}
.coupon .right .cdate{font-size:11px;color:#999;margin-top:4px;line-height:1.4}
.coupon .right .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.coupon .right .tag{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid #ddd;color:#888}
.coupon .right .tag.rec{background:#fff7e6;border-color:#ffd591;color:#ad6800}
.coupon .right .tag.warn{background:#fff1f0;border-color:#ffa39e;color:#cf1322}
.coupon .right .tag.port{background:#f0f5ff;border-color:#adc6ff;color:#2f54eb}
.coupon .right .actions{display:flex;gap:8px;margin-top:8px;align-items:center}
.coupon .right .btn-use{margin-left:auto;padding:4px 14px;border-radius:14px;font-size:12px;font-weight:600;background:linear-gradient(135deg,#ff6b35,#ff4500);color:#fff;border:none;cursor:pointer}
.coupon .right .rule-link{font-size:11px;color:#534AB7;cursor:pointer;white-space:nowrap}
/* 置灰 */
.coupon.disabled .left{background:#d9d9d9!important}
.coupon.disabled .right .cname,.coupon.disabled .right .cdate,.coupon.disabled .right .tag{color:#bbb!important;border-color:#eee!important}
.coupon.disabled .right .tag.port{background:#fafafa;color:#aaa;border-color:#eee}
.coupon.disabled .right .btn-use{display:none}
/* 规则弹窗 */
.rule-overlay{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:24px}
.rule-overlay.show{display:flex}
.rule-card{background:#fff;border-radius:14px;width:300px;max-height:70vh;overflow-y:auto;padding:20px}
.rule-card h3{font-size:16px;text-align:center;margin-bottom:14px;color:#333}
.rule-card .ri{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.rule-card .ri .rl{color:#666}
.rule-card .ri .rr{color:#333;font-weight:500;text-align:right;max-width:60%}
.rule-close{display:block;margin:14px auto 0;background:#534AB7;color:#fff;border:none;padding:7px 28px;border-radius:16px;font-size:13px;cursor:pointer}
/* 复制按钮 */
.copy-btn{position:fixed;right:12px;bottom:18px;z-index:50;background:#534AB7;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(83,74,183,.35);font-weight:600}
</style>
</head>
<body>

<div class="nav">我的优惠券 · 未使用</div>

<div class="list" id="list"></div>

<div class="rule-overlay" id="ruleOverlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="rule-card" id="ruleCard"></div>
</div>

<button class="copy-btn" onclick="copySource()">📋 复制源码（墨刀）</button>

<script>
var coupons = [
  {name:'会员日满200减30',amount:30,threshold:200,start:'2026.07.28',expire:'2026.08.19',scope:'全场通用',rec:true},
  {name:'新人专享满99减20',amount:20,threshold:99,start:'2026.07.22',expire:'2026.08.15',scope:'指定商品'},
  {name:'福利直播满100减10',amount:10,threshold:100,start:'2026.07.21',expire:'2026.08.04',scope:'全场通用',warn:true,warnText:'2天后过期'},
  {name:'老客回馈无门槛10元',amount:10,threshold:0,start:'2026.07.28',expire:'2026.08.21',scope:'仅泰尔超优惠H5',port:true,disabled:true}
];

function render(){
  var html='';
  for(var i=0;i<coupons.length;i++){
    var c=coupons[i];
    var bg=c.disabled?'#d9d9d9':'linear-gradient(135deg,#ff6b35,#ff4500)';
    var disCls=c.disabled?' disabled':'';
    var recTag=c.rec?'<span class="tag rec">推荐</span>':'';
    var warnTag=c.warn?'<span class="tag warn">'+c.warnText+'</span>':'';
    var portTag=c.port?'<span class="tag port">生效中·'+c.scope+'</span>':'<span class="tag">'+c.scope+'</span>';
    var btnUse=c.disabled?'':'<button class="btn-use" onclick="toast(\'跳转商品详情页\')">去使用</button>';

    html+='<div class="coupon'+disCls+'">'
      +'<div class="left" style="background:'+bg+'">'
        +'<span class="amt"><sub>¥</sub>'+c.amount+'</span>'
        +'<span class="cond">满'+c.threshold+'可用</span>'
      +'</div>'
      +'<div class="right">'
        +'<div class="cname">'+c.name+'</div>'
        +'<div class="cdate">'+c.start+' ~ '+c.expire+'</div>'
        +'<div class="tags">'+recTag+warnTag+(c.port?portTag:'<span class="tag">'+c.scope+'</span>')+'</div>'
        +'<div class="actions">'
          +'<span class="rule-link" onclick="showRule('+i+',event)">券规则 ›</span>'
          +btnUse
        +'</div>'
      +'</div>'
    +'</div>';
  }
  document.getElementById('list').innerHTML=html;
}

function showRule(idx,e){
  e.stopPropagation();
  var c=coupons[idx];
  document.getElementById('ruleCard').innerHTML='<h3>券规则</h3>'
    +'<div class="ri"><span class="rl">券名称</span><span class="rr">'+c.name+'</span></div>'
    +'<div class="ri"><span class="rl">面额</span><span class="rr">¥'+c.amount+'</span></div>'
    +'<div class="ri"><span class="rl">使用门槛</span><span class="rr">满¥'+c.threshold+'可用</span></div>'
    +'<div class="ri"><span class="rl">有效期</span><span class="rr">'+c.start+' ~ '+c.expire+'</span></div>'
    +'<div class="ri"><span class="rl">适用范围</span><span class="rr">'+c.scope+'</span></div>'
    +'<div class="ri"><span class="rl">说明</span><span class="rr">不可与其他优惠叠加使用</span></div>'
    +'<button class="rule-close" onclick="document.getElementById(\'ruleOverlay\').classList.remove(\'show\')">我知道了</button>';
  document.getElementById('ruleOverlay').classList.add('show');
}

function toast(msg){alert(msg)}

function copySource(){
  var src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  if(navigator.clipboard){navigator.clipboard.writeText(src).then(function(){alert('已复制完整源码，去墨刀粘贴即可')})}
  else{var ta=document.createElement('textarea');ta.value.src;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('已复制完整源码，去墨刀粘贴即可')}
}

render();
</script>
</body>
</html>
