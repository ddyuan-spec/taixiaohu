<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的优惠券-待使用</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:#e9e9ec;display:flex;align-items:center;justify-content:center;padding:20px}
/* 手机壳 */
.phone{width:399px;background:#1c1c1e;border-radius:46px;padding:12px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
.screen{width:375px;background:#f7f8fa;border-radius:34px;overflow:hidden;position:relative}
/* 状态栏 */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px 6px;font-size:13px;color:#222;font-weight:600}
.statusbar .sb-right{display:flex;align-items:center;gap:6px}
.statusbar .sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.statusbar .sig i{width:3px;background:#222;display:block;border-radius:1px}
.statusbar .sig i:nth-child(1){height:4px}.statusbar .sig i:nth-child(2){height:6px}.statusbar .sig i:nth-child(3){height:8px}.statusbar .sig i:nth-child(4){height:11px}
.statusbar .bat{width:22px;height:11px;border:1px solid #222;border-radius:3px;position:relative;padding:1px}
.statusbar .bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#222;border-radius:0 1px 1px 0}
.statusbar .bat i{display:block;height:100%;background:#222;border-radius:1px;width:80%}
/* 导航栏 */
.nav{background:#fff;padding:12px 16px;display:flex;align-items:center;border-bottom:1px solid #f0f0f0}
.nav-back{font-size:22px;color:#333;width:28px;cursor:default}
.nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:#333;margin-right:28px}
.nav-copy{background:#52c41a;color:#fff;border:none;padding:5px 12px;border-radius:14px;font-size:12px;font-weight:600;cursor:pointer}
/* Tab */
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee}
.tabs span{flex:1;text-align:center;padding:13px 0;font-size:14px;color:#999;position:relative}
.tabs span.active{color:#52c41a;font-weight:600}
.tabs span.active::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:24px;height:3px;background:#52c41a;border-radius:2px}
/* 券卡片 —— 对齐真实C端截图样式 */
.list{padding:12px}
.coupon{display:flex;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.coupon .left{width:105px;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.coupon .left.grn{background:#52c41a}
.coupon .left.gry{background:#d9d9d9}
.coupon .left .amt{font-size:36px;font-weight:700;line-height:1}
.coupon .left .amt sub{font-size:14px;font-weight:400;vertical-align:baseline}
.coupon .left .cond{font-size:11px;margin-top:4px;opacity:.85}
.coupon .right{flex:1;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:108px}
.coupon .right .cname{font-size:16px;font-weight:600;color:#333;line-height:1.3}
.coupon .right .crow{font-size:13px;color:#999;margin-top:6px;line-height:1.5}
.coupon .right .tag-rec{position:absolute;top:10px;right:14px;font-size:11px;color:#faad14;background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;padding:1px 6px}
.coupon .right .tag-warn{position:absolute;top:10px;right:14px;font-size:11px;color:#cf1322;background:#fff1f0;border:1px solid #ffa39e;border-radius:8px;padding:1px 6px}
.coupon .right .tag-port{position:absolute;top:10px;right:14px;font-size:11px;color:#999;background:#fafafa;border:1px solid #eee;border-radius:8px;padding:1px 6px}
.coupon .right .btn-use{position:absolute;right:14px;bottom:12px;padding:5px 16px;border-radius:16px;font-size:13px;font-weight:500;background:transparent;border:1px solid #ff6b35;color:#ff6b35;cursor:default}
.coupon .right .btn-use.dis{border-color:#ddd;color:#ccc}
/* 置灰整卡 */
.coupon.disabled .right .cname,
.coupon.disabled .right .crow{color:#bbb!important}
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-right">
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="bat"><i></i></span>
      </span>
    </div>

    <div class="nav">
      <span class="nav-back">‹</span>
      <span class="nav-title">我的优惠券</span>
      <button class="nav-copy" onclick="copySource()">复制源码</button>
    </div>

    <div class="tabs">
      <span class="active">待使用</span>
      <span>已使用</span>
      <span>已过期</span>
    </div>

    <div class="list">

      <!-- 券1：推荐 -->
      <div class="coupon">
        <div class="left grn">
          <span class="amt"><sub>¥</sub>30</span>
          <span class="cond">满200元可用</span>
        </div>
        <div class="right">
          <span class="tag-rec">推荐</span>
          <div class="cname">会员日满200减30</div>
          <div class="crow">适用：全场通用</div>
          <div class="crow">有效期至 2026-08-19</div>
          <span class="btn-use">去使用</span>
        </div>
      </div>

      <!-- 券2：指定商品 -->
      <div class="coupon">
        <div class="left grn">
          <span class="amt"><sub>¥</sub>20</span>
          <span class="cond">满99元可用</span>
        </div>
        <div class="right">
          <div class="cname">新人专享满99减20</div>
          <div class="crow">适用：指定商品</div>
          <div class="crow">有效期至 2026-08-15</div>
          <span class="btn-use">去使用</span>
        </div>
      </div>

      <!-- 券3：临期描红 -->
      <div class="coupon">
        <div class="left grn">
          <span class="amt"><sub>¥</sub>10</span>
          <span class="cond">满100元可用</span>
        </div>
        <div class="right">
          <span class="tag-warn">2天后过期</span>
          <div class="cname">福利直播满100减10</div>
          <div class="crow">适用：全场通用</div>
          <div class="crow">有效期至 2026-08-04</div>
          <span class="btn-use">去使用</span>
        </div>
      </div>

      <!-- 券4：跨端口置灰 -->
      <div class="coupon disabled">
        <div class="left gry">
          <span class="amt"><sub>¥</sub>10</span>
          <span class="cond">无门槛</span>
        </div>
        <div class="right">
          <span class="tag-port">生效中</span>
          <div class="cname">老客回馈无门槛10元</div>
          <div class="crow">适用：全场通用</div>
          <div class="crow">有效期至 2026-08-21</div>
          <span class="btn-use dis">去使用</span>
        </div>
      </div>

    </div><!-- /.list -->
  </div><!-- /.screen -->
</div><!-- /.phone -->

<script>
function fallbackCopy(src,ok,fail){
  var ta=document.createElement('textarea');
  ta.value=src;
  ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');ok();}catch(e){fail();}
  document.body.removeChild(ta);
}
function copySource(){
  var src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  function ok(){alert('已复制完整源码，去墨刀粘贴即可');}
  function fail(){alert('复制失败，请手动复制');}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(src).then(ok,function(){fallbackCopy(src,ok,fail);});
  }else{
    fallbackCopy(src,ok,fail);
  }
}
</script>
</body>
</html>
