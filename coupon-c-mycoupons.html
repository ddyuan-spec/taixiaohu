<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的优惠券</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:#f5f5f5;color:#333;width:375px;margin:0 auto;min-height:100vh}
.nav{background:#fff;border-bottom:1px solid #eee;padding:14px 16px;text-align:center;font-size:17px;font-weight:600;color:#000;position:sticky;top:0;z-index:100}

/* Tab */
.tab-bar{display:flex;background:#fff;padding:0 16px;border-bottom:1px solid #f0f0f0;position:sticky;top:48px;z-index:99}
.tab-item{flex:1;text-align:center;padding:12px 0;font-size:14px;color:#666;position:relative;cursor:pointer}
.tab-item.active{color:#ff6b35;font-weight:600}
.tab-item.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:28px;height:3px;background:#ff6b35;border-radius:2px}

/* 区块标题 */
.section-label{padding:14px 16px 8px;font-size:13px;color:#999;font-weight:500;letter-spacing:.5px}

/* 券卡片 */
.coupon-list{padding:0 12px 12px}
.coupon{background:#fff;border-radius:10px;margin-bottom:10px;overflow:hidden;display:flex;position:relative}
.coupon.dim{opacity:.55}
.coupon-left{width:108px;background:linear-gradient(135deg,#ff6b35,#ff8c42);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 8px;flex-shrink:0;position:relative}
.coupon-left::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:14px;height:14px;background:#f5f5f5;border-radius:50%;border:3px solid #ff8c42}
.coupon.dim .coupon-left{background:linear-gradient(135deg,#bbb,#ddd)}
.coupon.dim .coupon-left::after{border-color:#ccc}
.coupon-amount{font-size:32px;font-weight:700;line-height:1}
.coupon-amount small{font-size:13px;font-weight:400}
.coupon-threshold{font-size:11px;opacity:.85;margin-top:2px}
.coupon-right{flex:1;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:space-between;min-height:88px}
.coupon-name{font-size:15px;font-weight:600;color:#222;line-height:1.35}
.coupon.dim .coupon-name{color:#999}
.coupon-meta{font-size:12px;color:#888;margin-top:4px;line-height:1.7}
.coupon.dim .coupon-meta{color:#aaa}
.coupon-tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag-scope{font-size:10px;border:1px solid #e0a060;color:#c07830;border-radius:3px;padding:1px 5px;background:#fff9f0}
.tag-rec{font-size:10px;background:#fff0e8;color:#d46b08;border-radius:3px;padding:1px 5px}
.tag-expire-soon{font-size:10px;background:#fff1f0;color:#cf1322;border-radius:3px;padding:1px 5px;border:1px solid #ffa39e}
.tag-port-disabled{font-size:10px;background:#e6f7ff;color:#1890ff;border-radius:3px;padding:1px 5px}
.tag-status-used{font-size:11px;background:#f0f0f0;color:#999;border-radius:3px;padding:2px 8px;font-weight:500}
.tag-status-expired{font-size:11px;background:#f5f5f5;color:#999;border-radius:3px;padding:2px 8px;font-weight:500;border:1px solid #e8e8e8}
.btn-use{border:none;background:linear-gradient(135deg,#ff6b35,#ff8c42);color:#fff;font-size:12px;padding:5px 16px;border-radius:15px;cursor:pointer;font-weight:500;align-self:flex-start;margin-top:4px}
.btn-rule{border:none;background:none;color:#534AB7;font-size:12px;cursor:pointer;padding:5px 0;margin-top:4px}
/* 规则弹窗 */
.rule-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.rule-overlay.show{display:flex}
.rule-card{background:#fff;border-radius:12px;width:300px;padding:20px 18px;max-height:70vh;overflow-y:auto}
.rule-card h4{font-size:16px;margin-bottom:12px;color:#222}
.rule-row{font-size:13px;color:#555;line-height:2.2;border-bottom:1px solid #f5f5f5}
.rule-row:last-child{border:none}
.rule-close{display:block;margin:14px auto 0;background:#534AB7;color:#fff;border:none;padding:7px 28px;border-radius:16px;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<div class="nav">我的优惠券</div>

<div class="tab-bar">
  <div class="tab-item active">未使用</div>
  <div class="tab-item">已使用</div>
  <div class="tab-item">已过期</div>
</div>

<!-- ===== 未使用 ===== -->
<div class="section-label">未使用</div>
<div class="coupon-list" id="unused"></div>

<!-- ===== 已使用 ===== -->
<div class="section-label">已使用</div>
<div class="coupon-list" id="used"></div>

<!-- ===== 已过期 ===== -->
<div class="section-label">已过期</div>
<div class="coupon-list" id="expired"></div>

<div class="rule-overlay" id="ruleOverlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="rule-card" id="ruleCard"></div>
</div>

<script>
var unusedCoupons = [
  {name:'会员日满200减30',amt:30,thr:200,vFrom:'2026-07-26',vTo:'2026-08-19',scope:'全场通用',rec:true},
  {name:'新人专享满99减20',amt:20,thr:99,vFrom:'2026-07-22',vTo:'2026-08-15',scope:'指定商品',rec:false},
  {name:'福利直播满100减10',amt:10,thr:100,vFrom:'2026-07-21',vTo:'2026-08-04',scope:'指定店铺',rec:false,daysLeft:2},
  {name:'老客回馈无门槛10元',amt:10,thr:0,vFrom:'2026-07-28',vTo:'2026-08-21',scope:'全场通用',rec:false,portDisabled:true,ports:'泰尔超优惠H5'}
];
var usedCoupons = [
  {name:'新人专享满99减20',amt:20,thr:99,usedTime:'2026-07-25 14:32',orderNo:'ORD20260725A31',scope:'指定商品'},
  {name:'老客回馈无门槛10元',amt:10,thr:0,usedTime:'2026-07-30 09:18',orderNo:'ORD20260730B07',scope:'全场通用'}
];
var expiredCoupons = [
  {name:'会员日满200减减30',amt:30,thr:200,expireTime:'2026-08-19 23:59',scope:'全场通用'},
  {name:'签到奖励满50减8',amt:8,thr:50,expireTime:'2026-08-18 19:30',scope:'指定商品'}
];

function scopeCls(s){return s==='全场通用'?'tag-scope':'tag-scope'}

function renderUnused(){
  var h='';
  for(var i=0;i<unusedCoupons.length;i++){
    var c=unusedCoupons[i],d=c.portDisabled?' dim':'';
    var rec=c.rec?'<span class="tag-rec">推荐</span>':'';
    var exp=c.daysLeft<=3&&c.daysLeft>0?'<span class="tag-expire-soon">'+c.daysLeft+'天后过期</span>':'';
    var port=c.portDisabled?'<span class="tag-port-disabled">生效中 · 仅'+c.ports+'</span>':'';
    h+='<div class="coupon'+d+'">'
      +'<div class="coupon-left"><div class="coupon-amount"><small>¥</small>'+c.amt+'</div><div class="coupon-threshold">'+(c.thr>0?'满'+c.thr+'可用':'无门槛')+'</div></div>'
      +'<div class="coupon-right">'
        +'<div class="coupon-name">'+c.name+'</div>'
        +'<div class="coupon-meta">'+c.vFrom.replace(/-/g,'.')+' ~ '+c.vTo.replace(/-/g,'.')+'</div>'
        +'<div class="coupon-tags"><span class="'+scopeCls(c.scope)+'">'+c.scope+'</span>'+rec+exp+port+'</div>'
        +'<div style="display:flex;justify-content:space-between;align-items:center">'
          +(c.portDisabled?'':'<button class="btn-use">去使用</button>')
          +'<button class="btn-rule" onclick="showRule(\'u\','+i+',event)">券规则 ›</button>'
        +'</div>'
      +'</div>'
    +'</div>';
  }
  document.getElementById('unused').innerHTML=h;
}

function renderUsed(){
  var h='';
  for(var i=0;i<usedCoupons.length;i++){
    var c=usedCoupons[i];
    h+='<div class="coupon dim">'
      +'<div class="coupon-left"><div class="coupon-amount"><small>¥</small>'+c.amt+'</div><div class="coupon-threshold">'+(c.thr>0?'满'+c.thr+'可用':'无门槛')+'</div></div>'
      +'<div class="coupon-right">'
        +'<div class="coupon-name">'+c.name+'</div>'
        +'<div class="coupon-meta">使用时间：'+c.usedTime+'</div>'
        +'<div class="coupon-meta">关联订单：'+c.orderNo+'</div>'
        +'<div class="coupon-tags"><span class="tag-status-used">✓ 已核销</span><span class="'+scopeCls(c.scope)+'">'+c.scope+'</span></div>'
        +'<button class="btn-rule" onclick="showRule(\'s\','+i+',event)">券规则 ›</button>'
      +'</div>'
    +'</div>';
  }
  document.getElementById('used').innerHTML=h;
}

function renderExpired(){
  var h='';
  for(var i=0;i<expiredCoupons.length;i++){
    var c=expiredCoupons[i];
    h+='<div class="coupon dim">'
      +'<div class="coupon-left"><div class="coupon-amount"><small>¥</small>'+c.amt+'</div><div class="coupon-threshold">'+(c.thr>0?'满'+c.thr+'可用':'无门槛')+'</div></div>'
      +'<div class="coupon-right">'
        +'<div class="coupon-name">'+c.name+'</div>'
        +'<div class="coupon-meta">过期时间：'+c.expireTime+'</div>'
        +'<div class="coupon-tags"><span class="tag-status-expired">✗ 已过期</span><span class="'+scopeCls(c.scope)+'">'+c.scope+'</span></div>'
        +'<button class="btn-rule" onclick="showRule(\'e\','+i+',event)">券规则 ›</button>'
      +'</div>'
    +'</div>';
  }
  document.getElementById('expired').innerHTML=h;
}

function showRule(type,idx,e){
  e.stopPropagation();
  var c;
  if(type==='u')c=unusedCoupons[idx];
  else if(type==='s')c=usedCoupons[idx];
  else c=expiredCoupons[idx];
  var rows='<h4>券规则</h4><div class="rule-row"><b>券名：</b>'+c.name+'</div><div class="rule-row"><b>面额：</b>¥'+c.amt+'</div><div class="rule-row"><b>门槛：</b>'+(c.thr>0?'满¥'+c.thr:'无门槛')+'</div><div class="rule-row"><b>适用范围：</b>'+(c.scope||'-')+'</div>';
  if(type==='u')rows+='<div class="rule-row"><b>有效期：</b>'+c.vFrom+' ~ '+c.vTo+'</div>';
  if(type==='s')rows+='<div class="rule-row"><b>核销时间：</b>'+(c.usedTime||'-')+'</div><div class="rule-row"><b>关联订单：</b>'+(c.orderNo||'-')+'</div>';
  if(type==='e')rows+='<div class="rule-row"><b>过期时间：</b>'+(c.expireTime||'-')+'</div>';
  if(c.portDisabled)rows+='<div class="rule-row"><b>可用端口：</b>'+c.ports+'</div>';
  rows+='<button class="rule-close" onclick="document.getElementById(\'ruleOverlay\').classList.remove(\'show\')">我知道了</button>';
  document.getElementById('ruleCard').innerHTML=rows;
  document.getElementById('ruleOverlay').classList.add('show');
}

renderUnused();renderUsed();renderExpired();
</script>
</body>
</html>
