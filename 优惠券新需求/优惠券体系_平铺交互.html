<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>优惠券体系 · 页面评审</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#333;font-size:13px}

/* ===== Header ===== */
.header{background:#fff;border-bottom:1px solid #e8e8e8;padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.header h1{font-size:16px;font-weight:700;color:#222}
.header .sub{font-size:12px;color:#999}
.header .search{margin-left:auto}
.header input{border:1px solid #d9d9d9;border-radius:6px;padding:7px 12px;width:220px;font-size:12.5px;outline:none;transition:border-color .2s}
.header input:focus{border-color:#534AB7;box-shadow:0 0 0 2px rgba(83,74,183,.1)}

/* ===== Group Bar ===== */
.group-bar{background:#fff;padding:10px 28px;border-bottom:1px solid #eee;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:53px;z-index:40}
.gbtn{padding:5px 14px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#666;transition:all .15s}
.gbtn:hover{border-color:#534AB7;color:#534AB7}
.gbtn.active{background:#534AB7;color:#fff;border-color:#534AB7}
.gbtn .cnt{font-size:10px;margin-left:3px;opacity:.75}

/* ===== Card Grid ===== */
.grid-wrap{padding:24px 28px 60px}
.grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:flex-start}

/* ===== Card ===== */
.card{background:#fff;border-radius:10px;border:1px solid #e8e8e8;overflow:hidden;transition:box-shadow .2s,border-color .2s;width:260px;flex-shrink:0}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);border-color:#c0c0c0}
.card-img-wrap{background:#fafafa;position:relative;padding:0;overflow:hidden}
.card-img{width:100%;display:block;height:auto;max-height:420px;object-fit:contain;cursor:pointer;transition:transform .25s}
.card-img:hover{transform:scale(1.03)}
.card-info{padding:10px 12px 12px}
.card-name{font-size:13px;font-weight:600;color:#222;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-id{font-size:11px;color:#999;font-family:"SF Mono",Consolas,monospace;margin-bottom:8px}
.card-actions{display:flex;justify-content:flex-end}
.btn-detail{font-size:11.5px;padding:5px 14px;border-radius:5px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#555;transition:all .15s}
.btn-detail:hover{background:#534AB7;color:#fff;border-color:#534AB7}

/* Tag dot */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot-y{background:#f59e0b}.dot-r{background:#22c55e}.dot-g{background:#94a3b8}

/* ===== Modal ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:880px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-head h2{font-size:15px;font-weight:700}
.modal-close{cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#999;border:none;background:none;transition:background .15s}
.modal-close:hover{background:#f5f5f5;color:#333}
.modal-body{overflow-y:auto;padding:20px 24px 28px;line-height:1.75;font-size:12.5px;flex:1}
.modal-body h3{font-size:15px;font-weight:700;margin:16px 0 8px;color:#222}
.modal-body h3:first-child{margin-top:0}
.modal-body h4{font-size:13px;font-weight:700;margin:12px 0 5px;color:#534AB7}
.modal-body p{margin:6px 0;color:#444}
.modal-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11.5px}
.modal-body th,.modal-body td{border:1px solid #eee;padding:7px 10px;text-align:left}
.modal-body th{background:#f8f8fc;font-weight:600;color:#666}
.modal-body ul{padding-left:18px;margin:5px 0}
.modal-body li{margin-bottom:2px}
.modal-body img{max-width:100%;border-radius:8px;border:1px solid #eee;margin:8px 0;cursor:pointer}
.modal-body img:hover{opacity:.85}

/* Fullscreen img */
.img-full{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.img-full.show{display:flex}
.img-full img{max-width:94vw;max-height:94vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:#bbb}
.empty-icon{font-size:40px;margin-bottom:10px}

/* Scrollbar */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🎫 优惠券体系新需求</h1>
  <span class="sub">页面评审 · 共 <strong id="totalCount">0</strong> 个页面</span>
  <div class="search"><input id="searchInput" placeholder="搜索页面名称..." oninput="filterCards()"></div>
</div>

<!-- Group filter bar -->
<div class="group-bar" id="groupBar"></div>

<!-- Cards -->
<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="empty-icon">🔍</div>
    <p>没有匹配的页面</p>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">需求详情</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Fullscreen Image -->
<div class="img-full" id="imgFull" onclick="this.classList.remove('show')"></div>

<script>
// ========== Data ==========
const PAGES = [
  // ===== 平台端后台 (4.1) =====
  {group:'平台端后台',id:'4.1.0',title:'平台端后台总览',tag:'r',img:'coupon-prd-assets/coupon-platform.png',
   detail:`<h3>平台端后台总览</h3><p>原型示意：左侧导航菜单包含「优惠券管理」「发券活动管理」「数据看板」等模块。右侧内容区展示各功能页面的操作界面。</p><img src="coupon-prd-assets/coupon-platform.png" alt="平台端后台原型"><h4>模块清单</h4><ul><li>P1 优惠券管理列表（已有-沿用）— 券模板 CRUD，本期补充总库存/创建日期列</li><li>D1 券详情（本期新增）— 从列表点击查看进入，展示完整券配置信息</li><li>D2 新建/编辑优惠券（本期新增）— 规则引擎表单：面额/门槛/有效期/适用范围等</li><li>P2 发券活动管理列表（本期新增）— 按触发源筛选的活动列表</li><li>D3 新建/编辑发券活动·规则引擎（本期新增）— 配置触发源/阈值/等级/券模板/每人上限</li><li>P4 数据看板（本期新增）— 发放量/核销量/核销金额/趋势图 + 券明细记录 Tab</li><li>P5 用户券查询（本期新增）— 嵌入会员管理→用户详情 Tab，按用户查券实例</li></ul>`},
  {group:'平台端后台',id:'4.1.1',title:'P1 优惠券管理列表',tag:'r',img:'coupon-prd-assets/coupon-platform.png',
   detail:`<h3>P1 优惠券管理列表</h3><p>沿用现有功能，本期补充「总库存」「创建日期」列与下架/删除按钮逻辑。</p><h4>列表字段表</h4><table><thead><tr><th>字段名称</th><th>需求说明</th><th>备注</th></tr></thead><tbody><tr><td>优惠券名称</td><td>券模板名称</td><td>取《券模板表》name</td></tr><tr><td>优惠券类型</td><td>满减券 / 折扣券 / 代金券等</td><td>取 coupon_type</td></tr><tr><td>店铺</td><td>所属店铺名</td><td>平台端可跨店；商家端写死自身店铺</td></tr><tr><td>使用规则</td><td>券面额/门槛摘要（如"满99减20"）</td><td>取规则字段拼接</td></tr><tr><td>状态</td><td>启用 / 下架</td><td>取 status 枚举</td></tr><tr><td>有效期</td><td>固定时间段 / 领取后生效天数</td><td>取 time_type + 对应值</td></tr><tr><td>已领取</td><td>已发放券数</td><td>取《用户券表》count</td></tr><tr><td>剩余</td><td>总库存 − 已领取</td><td>实时计算</td></tr><tr><td>总库存</td><td>该券模板发行量上限</td><td>取《券模板表》total_stock；新增列</td></tr><tr><td>创建日期</td><td>券模板创建日期</td><td>取《券模板表》create_time；新增列</td></tr></tbody></table><h4>功能按钮（操作列）</h4><table><thead><tr><th>按钮</th><th>显示条件</th><th>功能说明</th><th>权限</th></tr></thead><tbody><tr><td>查看</td><td>所有状态</td><td>进入 D1 券详情</td><td>直播运营</td></tr><tr><td>增加发行量</td><td>所有状态</td><td>弹窗输入追加数量（≥1），确认后剩余+=N</td><td>直播运营</td></tr><tr><td>下架</td><td>状态=启用</td><td>置「下架」状态（不可逆）</td><td>直播运营</td></tr><tr><td>删除</td><td>状态=下架</td><td>从列表删除（需二次确认）</td><td>直播运营</td></tr></tbody></table>`},
  {group:'平台端后台',id:'4.1.2',title:'D1 券详情',tag:'y',img:'coupon-prd-assets/coupon-d1-coupon-detail.png',
   detail:`<h3>D1 券详情</h3><p>平台端当前无独立券详情页（仅商家端有），本期新建。从 P1 列表点击「查看」进入。</p><img src="coupon-prd-assets/coupon-d1-coupon-detail.png" alt="D1券详情"><h4>页面字段表</h4><table><thead><tr><th>字段/区域</th><th>需求说明</th><th>备注</th></tr></thead><tbody><tr><td>券配置名称</td><td>文本只读，显示券模板名称</td><td>取《券模板表》name</td></tr><tr><td>券编码提示</td><td>名称旁显示券编码（hint 文字）</td><td>取 template_code</td></tr><tr><td>有效时间类型</td><td>Radio 只读：固定时间段 / 领取后生效</td><td>取 time_type</td></tr><tr><td>固定时间段</td><td>日期范围：开始 ~ 结束，只读</td><td>time_type=fixed 时显示</td></tr><tr><td>领取后有效天数</td><td>数字只读：X 天内有效</td><td>time_type=after 时显示</td></tr><tr><td>活动范围</td><td>内嵌表格：店铺/券类型/发行量/每人限领</td><td>取关联规则配置</td></tr><tr><td>商品选择</td><td>Radio 只读：全部/指定参与/排除不参与</td><td>取 product_scope</td></tr><tr><td>发放方式</td><td>文本只读，显示发放渠道</td><td>取 issue_mode</td></tr><tr><td>状态</td><td>状态 Tag（未开始/进行中/已下架…）</td><td>取 status 枚举</td></tr></tbody></table><h4>详细逻辑规则</h4><p><b>界面与展示规则：</b></p><ul><li>入参校验：仅当从 P1 列表携带合法券ID进入；不存在或已删除→Toast「券不存在」并返回</li><li>极限值处理：券名超20字截断加「…」；未知状态枚举→显示「-」</li></ul><p><b>业务逻辑与边界条件：</b></p><ul><li>未登录拦截：需「直播运营」角色权限；无权限时 P1 不展示「查看」入口</li><li>交互反馈：点击「下架」→ 二次确认弹窗 → 确认后置下架 → 即时刷新 → Toast「已下架」</li><li>按钮状态切换：「下架」仅当前状态=进行中时可点；已发放=0 或用户确认强制下架</li><li>防刷控制：同一券 2 秒内最多 1 次下架操作</li></ul>`},
  {group:'平台端后台',id:'4.1.3',title:'D2 新建/编辑优惠券',tag:'y',img:'coupon-prd-assets/coupon-d2-new-coupon.png',
   detail:`<h3>D2 新建/编辑优惠券</h3><p>规则引擎表单页面，用于创建或修改券模板配置。</p><img src="coupon-prd-assets/coupon-d2-new-coupon.png" alt="D2新建编辑券"><h4>表单字段</h4><table><thead><tr><th>字段</th><th>逻辑说明</th><th>备注</th></tr></thead><tbody><tr><td>券名称</td><td>文本必填，最长 50 字符</td><td>空→提示"请填写券名称"</td></tr><tr><td>券类型</td><td>下拉：满减券 / 折扣券 / 代金券</td><td>决定后续面额/门槛字段形态</td></tr><tr><td>面额 / 折扣值</td><td>根据类型动态变化</td><td>满减=金额；折扣=百分比</td></tr><tr><td>使用门槛</td><td>无门槛 / 满 X 元可用</td><td>数值≥0</td></tr><tr><td>有效期类型</td><td>Radio：固定时间段 / 领取后生效</td><td>联动下方字段显隐</td></tr><tr><td>每人限领</td><td>数字 ≥ 1</td><td>默认 1</td></tr><tr><td>发行量</td><td>数字 ≥ 1</td><td>总库存上限</td></tr></tbody></table><h4>详细逻辑规则</h4><p><b>界面与展示规则：</b></p><ul><li>入参校验：所有必填项空值提交→对应字段红框+提示文案；券类型切换时动态校验关联字段</li><li>极限值处理：面额最大 99999；门槛最大 999999；发行量最大 999999</li><li>动态表单联动：券类型切换→面额/门槛 label 文本变化；有效期类型切换→时间段/天数字段显隐</li></ul><p><b>业务逻辑与边界条件：</b></p><ul><li>未登录拦截：同 D1，需直播运营权限</li><li>交互反馈：保存中按钮 disabled+loading"保存中..."防重复；成功→toast+跳转列表；失败→toast 显示错误</li><li>按钮状态切换：编辑模式仅「未开始」「已下架」状态的券可编辑；进行中不可改规则</li><li>防刷控制：2 秒内最多 1 次保存</li></ul>`},
  {group:'平台端后台',id:'4.1.4',title:'P2 发券活动 + D3 规则引擎',tag:'y',img:'coupon-prd-assets/coupon-p2-send-list.png',
   detail:`<h3>P2 发券活动管理列表 + D3 发券活动（规则引擎）</h3><p><b>P2 发券活动管理列表</b></p><img src="coupon-prd-assets/coupon-p2-send-list.png" alt="P2发券活动列表"><p><b>D3 新建/编辑发券活动（规则引擎）</b></p><img src="coupon-prd-assets/coupon-d3-send-edit.png" alt="D3规则引擎"><h4>D3 表单字段</h4><table><thead><tr><th>字段</th><th>逻辑说明</th><th>备注</th></tr></thead><tbody><tr><td>活动名称</td><td>文本必填</td><td>空→"请填写活动名称"</td></tr><tr><td>触发源</td><td>下拉 7 选 1：直播时长/支付完成/注册完成/首单完成/连续签到/浏览商品/分享活动</td><td>—</td></tr><tr><td>观看阈值</td><td>随触发源动态变化标签文本</td><td>注册完成/首单完成隐藏</td></tr><tr><td>关联直播标签</td><td>仅直播时长显示；取风控管理直播标签</td><td>其他触发源隐藏</td></tr><tr><td>适用会员等级</td><td>全部 / 指定等级(Lv1-8 多选)</td><td>—</td></tr><tr><td>每人限制发券上限</td><td>数字≥1，默认 1</td><td>多选券模板时每种独立限张</td></tr><tr><td>开始发券时间</td><td>datetime-local 精确到秒</td><td>异步发券，无冷却</td></tr><tr><td>关联券模板</td><td>多选，实时显示已选数</td><td>至少 1 个</td></tr></tbody></table><h4>详细逻辑规则</h4><p><b>界面与展示规则：</b></p><ul><li>入参校验(P2)：触发源单选筛选；时间区间；空条件默认查全部；无数据→空态</li><li>入参校验(D3)：活动名称必填；关联券模板≥1；每人上限≥1 数字；开始时间必填</li><li>动态联动：触发源切换→阈值字段显隐；直播时长→显示关联直播标签</li></ul><p><b>业务逻辑与边界条件：</b></p><ul><li>未登录拦截：需「直播运营」权限</li><li>交互反馈：保存中 disabled+loading；成功→toast+刷新列表(置顶)；失败→toast 错误</li><li>按钮状态：「编辑」仅未开始/暂停可点；「删除」需二次确认</li><li>防刷：2 秒内最多 1 次保存</li><li>数据一致性：删除活动不影响已发放券实例</li></ul>`},
  {group:'平台端后台',id:'4.1.6',title:'P4 数据看板',tag:'y',img:'coupon-prd-assets/coupon-p4-dashboard.png',

// ========== Render ==========
const grid = document.getElementById('grid');
const groupBar = document.getElementById('groupBar');
const empty = document.getElementById('empty');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const imgFull = document.getElementById('imgFull');

let activeGroup = '';
let filteredPages = [...PAGES];

document.getElementById('totalCount').textContent = PAGES.length;

function getGroups() {
  const m = {};
  PAGES.forEach(p => { if(!m[p.group]) m[p.group]=[]; m[p.group].push(p); });
  return m;
}

function renderGroups() {
  const groups = getGroups();
  let html = '<button class="gbtn' + (!activeGroup?' active':'') + '" onclick="setGroup(\'\')">全部</button>';
  Object.keys(groups).forEach(g => {
    const cnt = groups[g].length;
    html += `<button class="gbtn${activeGroup===g?' active':''}" onclick="setGroup('${g}')">${g}<span class="cnt">${cnt}</span></button>`;
  });
  groupBar.innerHTML = html;
}

function renderCards() {
  if(filteredPages.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  grid.style.display = 'flex';
  empty.style.display = 'none';
  grid.innerHTML = filteredPages.map(p => `
    <div class="card" data-id="${p.id}">
      <div class="card-img-wrap">
        <img class="card-img" src="${p.img}" alt="${p.title}" loading="lazy"
          onclick="showFullImg('${p.img}')">
      </div>
      <div class="card-info">
        <div class="card-name"><span class="dot dot-${p.tag}"></span>${p.title}</div>
        <div class="card-id">${p.id}</div>
        <div class="card-actions">
          <button class="btn-detail" onclick="openDetail('${p.id}')">查看详情</button>
        </div>
      </div>
    </div>
  `).join('');
}

function setGroup(g) {
  activeGroup = g;
  renderGroups();
  applyFilter();
}

function filterCards() {
  applyFilter();
}

function applyFilter() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  filteredPages = PAGES.filter(p => {
    const matchGroup = !activeGroup || p.group === activeGroup;
    const matchQ = !q || p.title.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
    return matchGroup && matchQ;
  });
  renderCards();
}

function openDetail(id) {
  const p = PAGES.find(x=>x.id===id);
  if(!p) return;
  modalTitle.textContent = `${p.id} ${p.title}`;
  modalBody.innerHTML = p.detail;
  // Bind image clicks in modal
  modalBody.querySelectorAll('img').forEach(img => {
    img.onclick = (e) => { e.stopPropagation(); showFullImg(img.src); };
  });
  modalOverlay.classList.add('show');
}

function closeModal() {
  modalOverlay.classList.remove('show');
}

function showFullImg(src) {
  imgFull.innerHTML = `<img src="${src}" alt="full">`;
  imgFull.classList.add('show');
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    if(imgFull.classList.contains('show')) imgFull.classList.remove('show');
    else if(modalOverlay.classList.contains('show')) closeModal();
  }
});

// Init
renderGroups();
renderCards();
</script>
</body>
</html>
