<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>优惠券体系新需求 · 平铺交互评审板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--card-bg:#fff;--primary:#5b7ff5;--primary-light:#eef2ff;--text:#1a202c;--text2:#5a657d;--border:#e2e8f0;--tag-new:#fef3c7;--tag-new-tx:#92400e;--tag-old:#e8f5e9;--tag-old-tx:#2e7d32;--shadow:0 2px 12px rgba(30,30,50,.07);--radius:12px}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;display:flex;overflow:hidden}
/* ===== Sidebar ===== */
.sidebar{width:236px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.sb-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sb-header h1{font-size:15px;font-weight:700;color:var(--text)}
.sb-header p{font-size:11px;color:var(--text2);margin-top:3px}
.sb-search{padding:10px 16px}
.sb-search input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;outline:none}
.sb-search input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,127,245,.15)}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-group{margin-bottom:4px}
.sb-g-title{padding:6px 16px;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.sb-item{padding:8px 16px 8px 24px;cursor:pointer;font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:6px;transition:background .15s}
.sb-item:hover{background:var(--primary-light);color:var(--primary)}
.sb-item.active{background:var(--primary-light);color:var(--primary);font-weight:600;border-left:3px solid var(--primary)}
.sb-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-y{background:#f59e0b}.dot-r{background:#ef4444}.dot-g{background:#22c55e}
/* ===== Main Canvas ===== */
.main{flex:1;display:flex;overflow:hidden}
.canvas-wrap{flex:1;overflow:auto;padding:20px 24px;position:relative}
.canvas{display:flex;flex-wrap:wrap;gap:18px;align-content:start;min-height:100%}
/* ===== Card ===== */
.card{width:380px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);cursor:grab;transition:box-shadow .2s,transform .15s;position:relative;user-select:none}
.card:hover{box-shadow:0 6px 24px rgba(30,30,50,.12)}
.card.dragging{opacity:.6;transform:scale(1.02);z-index:100;box-shadow:0 12px 40px rgba(30,30,50,.18)}
.card-head{padding:12px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0f1f5}
.card-id{font-family:"SF Mono",Consolas,monospace;font-size:11px;background:#f1f3f5;padding:2px 7px;border-radius:5px;color:var(--text2)}
.card-title{font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.tag.y{background:var(--tag-new);color:var(--tag-new-tx)}.tag.r{background:var(--tag-old);color:var(--tag-old-tx)}
.card-body{padding:10px 14px}
.card-img{width:100%;border-radius:8px;border:1px solid #eee;cursor:pointer;transition:border-color .2s;object-fit:cover;max-height:240px}
.card-img:hover{border-color:var(--primary)}
.card-desc{margin-top:10px;font-size:11.5px;line-height:1.65;color:var(--text2);max-height:120px;overflow-y:auto}
.card-desc h6{font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:4px}
.card-desc ul{padding-left:14px;margin:3px 0}
.card-desc li{margin-bottom:2px}
.card-footer{padding:8px 14px;border-top:1px solid #f0f1f5;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9aa0ad}
.card-footer span.badge{background:#eff6ff;color:var(--primary);padding:2px 8px;border-radius:10px}
/* ===== Detail Panel ===== */
.detail-panel{width:400px;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s}
.detail-panel.hidden{transform:translateX(100%);position:absolute;right:0;top:0;bottom:0}
.dp-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.dp-head h2{font-size:15px;font-weight:700}
.dp-close{cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;center;font-size:18px;color:var(--text2);background:none;border:none}
.dp-close:hover{background:#f0f1f5}
.dp-body{flex:1;overflow-y:auto;padding:16px 18px;line-height:1.7;font-size:12.5px}
.dp-body h3{font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--text)}
.dp-body h3:first-child{margin-top:0}
.dp-body h4{font-size:12.5px;font-weight:700;margin:10px 0 4px;color:var(--primary)}
.dp-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11.5px}
.dp-body th,.dp-body td{border:1px solid #eef0f5;padding:6px 10px;text-align:left}
.dp-body th{background:#f8f9fc;font-weight:600;color:var(--text2)}
.dp-body ul{padding-left:16px;margin:4px 0}
.dp-body li{margin-bottom:3px}
.dp-body img{max-width:100%;border-radius:8px;border:1px solid #eee;margin:8px 0;cursor:pointer}
.dp-img-full{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dp-img-full img{max-width:90vw;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
/* ===== Empty state ===== */
.empty{text-align:center;padding:80px 20px;color:#9aa0ad}
.empty-icon{font-size:48px;margin-bottom:12px}
/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
/* ===== Responsive ===== */
@media(max-width:1100px){.detail-panel{width:320px}.sidebar{width:200px}}
@media(max-width:800px){.sidebar{display:none}.detail-panel{width:280px}.card{width:100%}}
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<div class="sidebar">
<div class="sb-header"><h1>🎫 优惠券体系</h1><p>平铺交互评审板 · v2.3</p></div>
<div class="sb-search"><input id="searchInput" placeholder="搜索页面 / 功能点..." oninput="filterCards()"></div>
<div class="sb-nav" id="sbNav"></div>
</div>

<!-- ===== Main ===== -->
<div class="main">
<div class="canvas-wrap">
<div class="canvas" id="canvas"></div>
</div>
<div class="detail-panel hidden" id="detailPanel">
<div class="dp-head"><h2 id="dpTitle">需求详情</h2><button class="dp-close" onclick="closeDetail()">✕</button></div>
<div class="dp-body" id="dpBody"></div>
</div>
</div>

<!-- Fullscreen image overlay -->
<div class="dp-img-full" id="imgOverlay" style="display:none" onclick="this.style.display='none'"></div>

<script>
// ========== Data: all PRD pages ==========
const PAGES = [
  // ===== 平台端后台 (4.1) =====
  {
    group:'平台端后台',id:'4.1.0',title:'平台端后台总览',tag:'r',tagText:'已有-沿用',
    img:'coupon-prd-assets/coupon-platform.png',
    desc:'<h6>概述</h6><p>平台端后台为运营侧管理入口，包含券模板 CRUD、发券活动（规则引擎）、数据看板、用户券查询等功能模块。本期新增发券活动、看板、用户券查询；券管理沿用现有功能并补充字段。</p>',
    detail:`<h3>平台端后台总览</h3>
<p>原型示意：左侧导航菜单包含「优惠券管理」「发券活动管理」「数据看板」等模块。右侧内容区展示各功能页面的操作界面。</p>
<img src="coupon-prd-assets/coupon-platform.png" alt="平台端后台原型">
<h4>模块清单</h4>
<ul>
<li>P1 优惠券管理列表（已有-沿用）— 券模板 CRUD，本期补充总库存/创建日期列</li>
<li>D1 券详情（本期新增）— 从列表点击查看进入，展示完整券配置信息</li>
<li>D2 新建/编辑优惠券（本期新增）— 规则引擎表单：面额/门槛/有效期/适用范围等</li>
<li>P2 发券活动管理列表（本期新增）— 按触发源筛选的活动列表</li>
<li>D3 新建/编辑发券活动·规则引擎（本期新增）— 配置触发源/阈值/等级/券模板/每人上限</li>
<li>P4 数据看板（本期新增）— 发放量/核销量/核销金额/趋势图 + 券明细记录 Tab</li>
<li>P5 用户券查询（本期新增）— 嵌入会员管理→用户详情 Tab，按用户查券实例</li>
</ul>`
  },
  {
    group:'平台端后台',id:'4.1.1',title:'P1 优惠券管理列表',tag:'r',tagText:'已有-沿用',
    img:'coupon-prd-assets/coupon-platform.png',
    desc:'<h6>核心变更</h6><ul><li>新增「总库存」列（已领取+剩余）</li><li>新增「创建日期」列</li><li>操作列：查看/增加发行量/下架/删除</li></ul>',
    detail:`<h3>P1 优惠券管理列表</h3>
<p>沿用现有功能，本期补充「总库存」「创建日期」列与下架/删除按钮逻辑。</p>
<h4>列表字段表</h4>
<table><thead><tr><th>字段名称</th><th>需求说明</th><th>备注</th></tr></thead><tbody>
<tr><td>优惠券名称</td><td>券模板名称</td><td>取《券模板表》name</td></tr>
<tr><td>优惠券类型</td><td>满减券 / 折扣券 / 代金券等</td><td>取 coupon_type</td></tr>
<tr><td>店铺</td><td>所属店铺名</td><td>平台端可跨店；商家端写死自身店铺</td></tr>
<tr><td>使用规则</td><td>券面额/门槛摘要（如"满99减20"）</td><td>取规则字段拼接</td></tr>
<tr><td>状态</td><td>启用 / 下架</td><td>取 status 枚举</td></tr>
<tr><td>有效期</td><td>固定时间段 / 领取后生效天数</td><td>取 time_type + 对应值</td></tr>
<tr><td>已领取</td><td>已发放券数</td><td>取《用户券表》count</td></tr>
<tr><td>剩余</td><td>总库存 − 已领取</td><td>实时计算</td></tr>
<tr><td>总库存</td><td>该券模板发行量上限</td><td>取《券模板表》total_stock；新增列</td></tr>
<tr><td>创建日期</td><td>券模板创建日期</td><td>取《券模板表》create_time；新增列</td></tr>
</tbody></table>
<h4>功能按钮（操作列）</h4>
<table><thead><tr><th>按钮</th><th>显示条件</th><th>功能说明</th><th>权限</th></tr></thead><tbody>
<tr><td>查看</td><td>所有状态</td><td>进入 D1 券详情</td><td>直播运营</td></tr>
<tr><td>增加发行量</td><td>所有状态</td><td>弹窗输入追加数量（≥1），确认后剩余+=N</td><td>直播运营</td></tr>
<tr><td>下架</td><td>状态=启用</td><td>置「下架」状态（不可逆）</td><td>直播运营</td></tr>
<tr><td>删除</td><td>状态=下架</td><td>从列表删除（需二次确认）</td><td>直播运营</td></tr>
</tbody></table>`
  },
  {
    group:'平台端后台',id:'4.1.2',title:'D1 券详情',tag:'y',tagText:'本期新增',
    img:'coupon-prd-assets/coupon-d1-coupon-detail.png',
    desc:'<h6>页面说明</h6><p>从 P1 列表点击「查看」进入。只读展示券模板全部配置：名称/编码/时间类型/固定时间段/有效天数/活动范围/商品选择/发放方式/状态 Tag。</p><ul><li>功能按钮：返回列表、下架（进行中状态可点，需确认）</li><li>入参校验：非法券ID→Toast 并返回</li></ul>',
    detail:`<h3>D1 券详情</h3>
<p>平台端当前无独立券详情页（仅商家端有），本期新建。从 P1 列表点击「查看」进入。</p>
<img src="coupon-prd-assets/coupon-d1-coupon-detail.png" alt="D1券详情">
<h4>页面字段表</h4>
<table><thead><tr><th>字段/区域</th><th>需求说明</th><th>备注</th></tr></thead><tbody>
<tr><td>券配置名称</td><td>文本只读，显示券模板名称</td><td>取《券模板表》name</td></tr>
<tr><td>券编码提示</td><td>名称旁显示券编码（hint 文字）</td><td>取 template_code</td></tr>
<tr><td>有效时间类型</td><td>Radio 只读：固定时间段 / 领取后生效</td><td>取 time_type</td></tr>
<tr><td>固定时间段</td><td>日期范围：开始 ~ 结束，只读</td><td>time_type=fixed 时显示</td></tr>
<tr><td>领取后有效天数</td><td>数字只读：X 天内有效</td><td>time_type=after 时显示</td></tr>
<tr><td>活动范围</td><td>内嵌表格：店铺/券类型/发行量/每人限领</td><td>取关联规则配置</td></tr>
<tr><td>商品选择</td><td>Radio 只读：全部/指定参与/排除不参与</td><td>取 product_scope</td></tr>
<tr><td>发放方式</td><td>文本只读，显示发放渠道</td><td>取 issue_mode</td></tr>
<tr><td>状态</td><td>状态 Tag（未开始/进行中/已下架…）</td><td>取 status 枚举</td></tr>
</tbody></table>
<h4>详细逻辑规则</h4>
<p><b>界面与展示规则：</b></p>
<ul>
<li>入参校验：仅当从 P1 列表携带合法券ID进入；不存在或已删除→Toast「券不存在」并返回</li>
<li>极限值处理：券名超20字截断加「…」；未知状态枚举→显示「-」</li>
</ul>
<p><b>业务逻辑与边界条件：</b></p>
<ul>
<li>未登录拦截：需「直播运营」角色权限；无权限时 P1 不展示「查看」入口</li>
<li>交互反馈：点击「下架」→ 二次确认弹窗 → 确认后置下架 → 即时刷新 → Toast「已下架」</li>
<li>按钮状态切换：「下架」仅当前状态=进行中时可点；已发放=0 或用户确认强制下架</li>
<li>防刷控制：同一券 2 秒内最多 1 次下架操作</li>
</ul>`
  },
  {
    group:'平台端后台',id:'4.1.3',title:'D2 新建/编辑优惠券',tag:'y',tagText:'本期新增',
    img:'coupon-prd-assets/coupon-d2-new-coupon.png',
    desc:'<h6>规则引擎表单</h6><ul><li>券名称/类型/面额/门槛</li><li>有效期：固定时间段 OR 领取后生效天数</li><li>活动范围：店铺/每人限领/发行量</li><li>商品选择：全部/指定/排除</li></ul><p>提交 loading 防重复建券；编辑仅未开始/已下架可点。</p>',
    detail:`<h3>D2 新建/编辑优惠券</h3>
<p>规则引擎表单页面，用于创建或修改券模板配置。</p>
<img src="coupon-prd-assets/coupon-d2-new-coupon.png" alt="D2新建编辑券">
<h4>表单字段</h4>
<table><thead><tr><th>字段</th><th>逻辑说明</th><th>备注</th></tr></thead><tbody>
<tr><td>券名称</td><td>文本必填，最长 50 字符</td><td>空→提示"请填写券名称"</td></tr>
<tr><td>券类型</td><td>下拉：满减券 / 折扣券 / 代金券</td><td>决定后续面额/门槛字段形态</td></tr>
<tr><td>面额 / 折扣值</td><td>根据类型动态变化</td><td>满减=金额；折扣=百分比</td></tr>
<tr><td>使用门槛</td><td>无门槛 / 满 X 元可用</td><td>数值≥0</td></tr>
<tr><td>有效期类型</td><td>Radio：固定时间段 / 领取后生效</td><td>联动下方字段显隐</td></tr>
<tr><td>每人限领</td><td>数字 ≥ 1</td><td>默认 1</td></tr>
<tr><td>发行量</td><td>数字 ≥ 1</td><td>总库存上限</td></tr>
</tbody></table>
<h4>详细逻辑规则</h4>
<p><b>界面与展示规则：</b></p>
<ul>
<li>入参校验：所有必填项空值提交→对应字段红框+提示文案；券类型切换时动态校验关联字段</li>
<li>极限值处理：面额最大 99999；门槛最大 999999；发行量最大 999999</li>
<li>动态表单联动：券类型切换→面额/门槛 label 文本变化；有效期类型切换→时间段/天数字段显隐</li>
</ul>
<p><b>业务逻辑与边界条件：</b></p>
<ul>
<li>未登录拦截：同 D1，需直播运营权限</li>
<li>交互反馈：保存中按钮 disabled+loading"保存中..."防重复；成功→toast+跳转列表；失败→toast 显示错误</li>
<li>按钮状态切换：编辑模式仅「未开始」「已下架」状态的券可编辑；进行中不可改规则</li>
<li>防刷控制：2 秒内最多 1 次保存</li>
</ul>`
  },
  {
    group:'平台端后台',id:'4.1.4',title:'P2 发券活动列表 + D3 规则引擎',tag:'y',tagText:'本期新增',
    img:'coupon-prd-assets/coupon-p2-send-list.png',
    desc:'<h6>双页结构</h6><p><b>P2 列表</b>：触发源筛选/时间范围/活动列表（名称/触发源/状态/关联券数/开始时间）。<br><b>D3 编辑</b>：活动名称/触发源(7选1)/观看阈值/关联直播标签/适用会员等级/每人上限/开始时间/关联券模板(多选)。</p>',
    detail:`<h3>P2 发券活动管理列表 + D3 发券活动（规则引擎）</h3>
<p><b>P2 发券活动管理列表</b></p>
<img src="coupon-prd-assets/coupon-p2-send-list.png" alt="P2发券活动列表">
<p><b>D3 新建/编辑发券活动（规则引擎）</b></p>
<img src="coupon-prd-assets/coupon-d3-send-edit.png" alt="D3规则引擎">
<h4>D3 表单字段</h4>
<table><thead><tr><th>字段</th><th>逻辑说明</th><th>备注</th></tr></thead><tbody>
<tr><td>活动名称</td><td>文本必填</td><td>空→"请填写活动名称"</td></tr>

<p>✅ 我的优惠券 / 下单核销 在两端为<b>已有功能</b>，本期不重做（原型以 toast 示意跳转，逻辑见各自线上实现）。</p>`
  }
];

// ========== Render ==========
const canvas = document.getElementById('canvas');
const sbNav = document.getElementById('sbNav');
const dpPanel = document.getElementById('detailPanel');
const dpTitle = document.getElementById('dpTitle');
const dpBody = document.getElementById('dpBody');
const imgOverlay = document.getElementById('imgOverlay');

let activeId = null;

function render() {
  // Sidebar
  const groups = {};
  PAGES.forEach(p => { if(!groups[p.group]) groups[p.group]=[]; groups[p.group].push(p); });
  sbNav.innerHTML = Object.entries(groups).map(([g,items]) =>
    `<div class="sb-group"><div class="sb-g-title">${g}</div>` +
    items.map(p => `<div class="sb-item" data-id="${p.id}" onclick="scrollToCard('${p.id}')"><span class="dot ${p.tag==='y'?'dot-y':p.tag==='r'?'dot-r':'dot-g'}"></span>${p.title}</div>`).join('') +
    `</div>`
  ).join('');

  // Cards
  canvas.innerHTML = PAGES.map((p,i) => `
    <div class="card" data-id="${p.id}" data-index="${i}"
      onmousedown="startDrag(event,this)" ontouchstart="startDrag(event,this)">
      <div class="card-head">
        <span class="card-id">${p.id}</span>
        <span class="card-title">${p.title}</span>
        <span class="tag ${p.tag}">${p.tagText}</span>
      </div>
      <div class="card-body">
        <img class="card-img" src="${p.img}" alt="${p.title}" loading="lazy"
          onclick="event.stopPropagation();showFullImg('${p.img}')">
        <div class="card-desc">${p.desc}</div>
      </div>
      <div class="card-footer">
        <span>${p.group}</span>
        <span class="badge" onclick="event.stopPropagation();openDetail('${p.id}')">查看详情 →</span>
      </div>
    </div>
  `).join('');
}

function scrollToCard(id) {
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  openDetail(id);
}

function openDetail(id) {
  const p = PAGES.find(x=>x.id===id);
  if(!p) return;
  activeId = id;
  dpTitle.textContent = `${p.id} ${p.title}`;
  dpBody.innerHTML = p.detail;
  // Bind image clicks in detail panel
  dpBody.querySelectorAll('img').forEach(img => {
    img.onclick = () => showFullImg(img.src);
  });
  dpPanel.classList.remove('hidden');
  // Highlight sidebar
  document.querySelectorAll('.sb-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  // Highlight card
  document.querySelectorAll('.card').forEach(el => {
    el.style.outline = el.dataset.id === id ? '2px solid var(--primary)' : '';
  });
}

function closeDetail() {
  dpPanel.classList.add('hidden');
  activeId = null;
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.card').forEach(el => el.style.outline = '');
}

function showFullImg(src) {
  imgOverlay.innerHTML = `<img src="${src}" alt="full">`;
  imgOverlay.style.display = 'flex';
}

// ========== Drag & Drop ==========
let dragEl = null, dragOffX = 0, dragOffY = 0;

function startDrag(e, el) {
  if(e.target.tagName === 'IMG' || e.target.closest('.badge')) return;
  dragEl = el;
  const rect = el.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  dragOffX = cx - rect.left;
  dragOffY = cy - rect.top;
  el.classList.add('dragging');
  el.style.position = 'absolute';
  el.style.zIndex = '100';
  moveAt(e);
  e.preventDefault();
}

function moveAt(e) {
  if(!dragEl) return;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  const wrap = canvas.getBoundingClientRect();
  dragEl.style.left = (cx - wrap.left - dragOffX + wrap.scrollLeft) + 'px';
  dragEl.style.top = (cy - wrap.top - dragOffY + wrap.scrollTop) + 'px';
}

document.addEventListener('mousemove', e => { if(dragEl) moveAt(e); });
document.addEventListener('touchmove', e => { if(dragEl) moveAt(e); }, {passive:false});
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

function endDrag() {
  if(dragEl) {
    dragEl.classList.remove('dragging');
    dragEl.style.position = '';
    dragEl.style.left = '';
    dragEl.style.top = '';
    dragEl.style.zIndex = '';
    dragEl = null;
  }
}

// ========== Search Filter ==========
function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(el => {
    const p = PAGES[el.dataset.index];
    const match = !q || p.id.toLowerCase().includes(q) || p.title.toLowerCase().includes(q) ||
                  p.group.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q);
    el.style.display = match ? '' : 'none';
  });
  document.querySelectorAll('.sb-item').forEach(el => {
    const match = !q || el.textContent.toLowerCase().includes(q);
    el.style.display = match ? '' : 'none';
  });
  document.querySelectorAll('.sb-g-title').forEach(el => {
    const group = el.textContent;
    const siblings = el.parentElement.querySelectorAll('.sb-item');
    const anyVisible = [...siblings].some(s => s.style.display !== 'none');
    el.style.display = (!q || anyVisible) ? '' : 'none';
  });
}

// ========== Init ==========
render();
// Auto-open first card detail
setTimeout(() => openDetail(PAGES[0].id), 300);
</script>
</body>
</html>
