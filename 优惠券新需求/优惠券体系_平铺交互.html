<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>优惠券体系 · 页面平铺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f1f5;color:#333}

/* Header */
.hd{
  background:#fff;border-bottom:1px solid #e2e4e8;
  padding:16px 40px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:50;
}
.hd h1{font-size:18px;font-weight:700;color:#1a1a2e}
.hd .sub{font-size:13px;color:#999}
.tot{font-size:13px;color:#888;margin-left:auto}

/* Section */
.sec{padding:26px 40px 8px}
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.sec-hd .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dot-c{background:linear-gradient(135deg,#534AB7,#6C5CE7)}
.dot-b{background:linear-gradient(135deg,#E8932B,#f6c77e)}
.sec-hd h2{font-size:18px;font-weight:700;color:#1a1a2e}
.sec-hd .cnt{font-size:12.5px;color:#aaa;background:#f0f0f0;padding:3px 11px;border-radius:10px;font-weight:500}

/* 横向分列 */
.cols{display:flex;gap:36px;overflow-x:auto;padding-bottom:20px}
.col{flex:0 0 auto;display:flex;flex-direction:column}
.col.col-c{width:280px}          /* C端：手机窄图，缩窄 */
.col.col-b{width:780px}          /* B端：桌面宽图 */
.col-hd{
  font-size:15px;font-weight:700;color:#333;
  padding:0 0 4px;margin-bottom:14px;
  border-bottom:2px solid #d9dbe0;
  display:flex;align-items:center;gap:8px;
}
.col-hd .tag{font-size:11px;padding:1px 7px;border-radius:4px;font-weight:600;flex-shrink:0}
.tag-c{background:#EDE9FB;color:#534AB7}
.tag-b{background:#FFF4E0;color:#B07A00}

/* 列内：上下堆叠的页面 */
.flow{display:flex;flex-direction:column}
.node{margin-bottom:20px}
.node .name{font-size:14px;font-weight:600;color:#333;padding:0 0 8px;display:flex;align-items:center;gap:6px}
.node .name .stale-badge{font-size:11px;font-weight:600;color:#E6A23C;background:#FFF4E0;padding:1px 7px;border-radius:4px;flex-shrink:0;white-space:nowrap}
.node img{width:100%;height:auto;display:block;cursor:pointer}
.node .ph{width:100%;aspect-ratio:400/819;background:#eef0f3;border:2px dashed #c8ccd4;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9aa0a8;gap:7px;margin-top:2px}
.node .ph .big{font-size:16px;font-weight:700;color:#8b9199;letter-spacing:3px}
.node .ph .sm{font-size:12px;color:#aab0b8;padding:0 10px;text-align:center;line-height:1.5}

/* Fullscreen */
.ifull{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.72);z-index:300;
  display:none;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(4px)
}
.ifull.show{display:flex}
.ifull img{max-width:96vw;max-height:96vh;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

.empty{text-align:center;padding:80px 20px;color:#bbb;font-size:15px}
::-webkit-scrollbar{height:7px;width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
</style>
</head>
<body>

<div class="hd">
  <h1>🎫 优惠券体系新需求 · 页面平铺</h1>
  <span class="sub">按页面跳转逻辑 · 同一组列表/详情上下排列，不同组横向分列 · 灰色虚框＝待补截图</span>
  <span class="tot">共 <strong id="tc">0</strong> 张</span>
</div>

<!-- C端 -->
<div class="sec" id="secC">
  <div class="sec-hd"><div class="dot dot-c"></div><h2>C端（用户侧）</h2><span class="cnt" id="cntC">0</span></div>
  <div class="cols" id="colsC"></div>
</div>

<!-- 后台 -->
<div class="sec" id="secB">
  <div class="sec-hd"><div class="dot dot-b"></div><h2>后台（管理侧）</h2><span class="cnt" id="cntB">0</span></div>
  <div class="cols" id="colsB"></div>
</div>

<div class="empty" id="empty" style="display:none">没有匹配的页面</div>

<div class="ifull" id="ifull" onclick="this.classList.remove('show')"></div>

<script>
// ========== 按跳转逻辑分组：col = 一组导航（列表→详情上下排列）；不同 col 横向排列 ==========
const SECTIONS = [
  {
    side:'C', key:'C', name:'C端（用户侧）',
    cols:[
      {g:'我的 / 资产线', items:[
        {title:'U 我的（资产入口）', img:'coupon-prd-assets/app-my-profile.png'},
        {title:'C2 我的优惠券（空态）', img:'coupon-prd-assets/app-my-coupons-empty.png'},
        {title:'C2 我的优惠券（可使用 / 已使用 / 已过期 三态）', ph:true},
        {title:'我的订单列表', img:'coupon-prd-assets/app-my-orders.png'},
      ]},
      {g:'商城购买线', items:[
        {title:'C5 商品详情', img:'coupon-prd-assets/app-product-detail.png'},
        {title:'C5 商品详情·领券区', ph:true},
        {title:'C5 优惠套餐选择弹窗', img:'coupon-prd-assets/app-product-deal-modal.png'},
        {title:'C6 确认订单（无券态）', img:'coupon-prd-assets/app-confirm-order.png'},
        {title:'C6 确认订单（含优惠券）', img:'coupon-prd-assets/app-confirm-order-with-coupon.png'},
        {title:'收银台（支付方式）', img:'coupon-prd-assets/app-payment.png'},
        {title:'支付成功', img:'coupon-prd-assets/app-payment-success.png'},
      ]},
      {g:'获券触达（系统发券）', items:[
        {title:'获券弹窗（App 端系统发券触达）', ph:true},
        {title:'获券弹窗（小程序 / H5 端）', ph:true},
      ]},
    ]
  },
  {
    side:'B', key:'B', name:'后台（管理侧）',
    cols:[
      {g:'平台端·优惠券管理', items:[
        {title:'P1 优惠券管理列表', img:'coupon-prd-assets/coupon-platform-new-form.png', stale:true},
        {title:'P1 列表（双状态版·上架+使用状态）', img:'coupon-prd-assets/pf-dual-status.png'},
        {title:'D1 券详情', img:'coupon-prd-assets/coupon-d1-coupon-detail.png', stale:true},
        {title:'D2 新建/编辑优惠券', img:'coupon-prd-assets/coupon-d2-new-coupon.png', stale:true},
        {title:'加库存弹窗（增加发行量）', img:'coupon-prd-assets/coupon-d1-increase-stock.png'},
      ]},
      {g:'平台端·发券活动', items:[
        {title:'P2 发券活动列表', img:'coupon-prd-assets/coupon-p2-send-list.png', stale:true},
        {title:'D3 新建/编辑发券活动', img:'coupon-prd-assets/coupon-d3-send-edit.png', stale:true},
      ]},
      {g:'平台端·数据看板', items:[
        {title:'P4 数据看板', img:'coupon-prd-assets/coupon-p4-dashboard.png', stale:true},
        {title:'P4 券明细记录', img:'coupon-prd-assets/coupon-p4-coupon-detail.png', stale:true},
      ]},
      {g:'平台端·用户券查询', items:[
        {title:'P5 用户券查询', img:'coupon-prd-assets/coupon-p5-user-coupon.png', stale:true},
      ]},
      {g:'商家端后台', items:[
        {title:'商家端·优惠券管理列表', img:'coupon-prd-assets/coupon-merchant.png'},
        {title:'商家端·券详情', img:'coupon-prd-assets/coupon-merchant.png'},
        {title:'商家端·新建优惠券', img:'coupon-prd-assets/coupon-merchant.png'},
        {title:'商家端·发券活动列表', img:'coupon-prd-assets/coupon-merchant.png'},
        {title:'商家端·新建发券活动', img:'coupon-prd-assets/coupon-merchant.png'},
        {title:'商家端·用户券查询', img:'coupon-prd-assets/coupon-merchant.png'},
      ]},
      {g:'平台端·直播观看记录与自动打标', items:[
        {title:'直播观看记录', img:'coupon-prd-assets/pf-live-view-log.png'},
        {title:'自动打标规则列表', img:'coupon-prd-assets/pf-auto-tag.png'},
      ]},
    ]
  },
];

const $=id=>document.getElementById(id);
const ifull=$('ifull');
let total=0;

function nodeHTML(p, i){
  const it = p.items[i];
  const staleBadge = it.stale ? '<span class="stale-badge">⚠ 截图待更新</span>' : '';
  const body = it.ph
    ? `<div class="ph"><div class="big">待补</div><div class="sm">${it.title}</div></div>`
    : `<img src="${it.img}" alt="${it.title}" loading="lazy" onclick="full('${p.img || it.img}')">`;
  return `<div class="node">
    <div class="name">${it.title}${staleBadge}</div>
    ${body}
  </div>`;
}

function colHTML(c, side){
  const tagCls = side==='C'?'tag-c':'tag-b';
  const label = side==='C'?'C':'B';
  const cls = side==='C'?'col-c':'col-b';
  const flow = c.items.map((_,i)=>nodeHTML(c,i)).join('');
  return `<div class="col ${cls}">
    <div class="col-hd"><span class="tag ${tagCls}">${label}</span>${c.g}</div>
    <div class="flow">${flow}</div>
  </div>`;
}

function realCount(cols){return cols.reduce((s,c)=>s+c.items.filter(i=>!i.ph).length,0);}

function renderSection(sec){
  const html = sec.cols.map(c=>colHTML(c, sec.side)).join('');
  total += realCount(sec.cols);
  return html;
}

$('colsC').innerHTML = renderSection(SECTIONS[0]);
$('colsB').innerHTML = renderSection(SECTIONS[1]);
$('cntC').textContent = realCount(SECTIONS[0].cols);
$('cntB').textContent = realCount(SECTIONS[1].cols);
$('tc').textContent = total;

function full(src){ifull.innerHTML=`<img src="${src}" onclick="event.stopPropagation()">`;ifull.classList.add('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')ifull.classList.remove('show')});
</script>
</body>
</html>
