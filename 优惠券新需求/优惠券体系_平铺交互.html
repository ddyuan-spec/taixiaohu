<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>优惠券体系 · 页面平铺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f1f3;color:#333;font-size:13px}

/* Header */
.hd{background:#fff;border-bottom:1px solid #e2e4e8;padding:14px 32px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.hd h1{font-size:16px;font-weight:700;color:#1a1a2e}
.hd .sub{font-size:12px;color:#999}
.hd .search{margin-left:auto}
.hd input{border:1px solid #d9d9d9;border-radius:6px;padding:7px 14px;width:200px;font-size:12px;outline:none}
.hd input:focus{border-color:#534AB7;box-shadow:0 0 0 2px rgba(83,74,183,.12)}

/* Section */
.sec{padding:24px 32px 16px}
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.sec-hd .dot{width:10px;height:10px;border-radius:3px}
.sec-hd .dot-c{background:linear-gradient(135deg,#534AB7,#6C5CE7)}
.sec-hd .dot-b{background:linear-gradient(135deg,#E8932B,#f6c77e)}
.sec-hd h2{font-size:17px;font-weight:700;color:#1a1a2e}
.sec-hd .cnt{font-size:12px;color:#aaa;background:#f5f5f5;padding:2px 10px;border-radius:10px}

/* Grid */
.grid{display:flex;flex-wrap:wrap;gap:18px}

/* Card — 纯截图+名称+按钮 */
.card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;overflow:hidden;width:240px;flex-shrink:0;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.09);border-color:#c5c8ce}
.card-img-wrap{background:#fafbfc;overflow:hidden;cursor:pointer;line-height:0}
.card-img{width:100%;height:auto;display:block;max-height:380px;object-fit:contain;transition:transform .2s}
.card-img:hover{transform:scale(1.04)}
.card-info{padding:10px 12px 12px}
.card-name{font-size:13px;font-weight:600;color:#222;margin-bottom:8px;line-height:1.35}
.card-btn-row{text-align:right}
.btn-v{font-size:11.5px;padding:5px 16px;border-radius:5px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#555;transition:all .15s}
.btn-v:hover{background:#534AB7;color:#fff;border-color:#534AB7}

/* Modal */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.ov.show{display:flex}
.md{background:#fff;border-radius:12px;width:860px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.md-hd{padding:15px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.md-hd h3{font-size:15px;font-weight:700}
.md-cl{cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:#999;border:none;background:0 0;font-size:18px}
.md-cl:hover{background:#f5f5f5;color:#333}
.md-bd{overflow-y:auto;padding:18px 22px 26px;line-height:1.72;font-size:12.5px;flex:1}
.md-bd h4{font-size:14px;font-weight:700;margin:14px 0 6px;color:#534AB7}
.md-bd h4:first-child{margin-top:0}
.md-bd p{margin:5px 0;color:#444}
.md-bd table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11.5px}
.md-bd th,.md-bd td{border:1px solid #eee;padding:7px 10px;text-align:left}
.md-bd th{background:#f8f8fc;font-weight:600;color:#666}
.md-bd ul{padding-left:18px;margin:4px 0}
.md-bd li{margin-bottom:2px}
.md-bd img{max-width:100%;border-radius:8px;border:1px solid #eee;margin:8px 0;cursor:pointer}
.md-bd img:hover{opacity:.85}

/* Fullscreen img */
.ifull{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);z-index:300;display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.ifull.show{display:flex}
.ifull img{max-width:94vw;max-height:94vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

.empty{text-align:center;padding:60px 20px;color:#bbb;font-size:14px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
</style>
</head>
<body>

<div class="hd">
  <h1>🎫 优惠券体系新需求</h1>
  <span class="sub">共 <strong id="tc">0</strong> 个页面</span>
  <div class="search"><input placeholder="搜索页面…" oninput="flt()" id="si"></div>
</div>

<!-- ===== C端（用户侧）===== -->
<div class="sec" id="secC">
  <div class="sec-hd"><div class="dot dot-c"></div><h2>C端（用户侧）</h2><span class="cnt" id="cntC">0</span></div>
  <div class="grid" id="gridC"></div>
</div>

<!-- ===== 后台（管理侧）===== -->
<div class="sec" id="secB">
  <div class="sec-hd"><div class="dot dot-b"></div><h2>后台（管理侧）</h2><span class="cnt" id="cntB">0</span></div>
  <div class="grid" id="gridB"></div>
</div>

<div class="empty" id="empty" style="display:none">没有匹配的页面</div>

<!-- Modal -->
<div class="ov" id="ov" onclick="if(event.target===this)cls()">
  <div class="md">
    <div class="md-hd"><h3 id="mt">详情</h3><button class="md-cl" onclick="cls()">✕</button></div>
    <div class="md-bd" id="mb"></div>
  </div>
</div>

<div class="ifull" id="ifull" onclick="this.classList.remove('show')"></div>

<script>
// ========== 数据：side='C'=用户侧 / 'B'=后台 ==========
const PG = [
  // ── C端 ──
  {side:'C',id:'App总览',title:'App 端原型总览',img:'coupon-prd-assets/coupon-app.png',
   detail:`<h4>App 端原型总览</h4><p>App 端为全链路新增。本期新建：获券弹窗、我的优惠券页、确认订单选券/核销逻辑。</p><img src="coupon-prd-assets/coupon-app.png"><ul><li>H 首页 — 获券弹窗入口</li><li>M 商城 — 商品列表</li><li>U 我的 — 资产入口</li><li>C2 我的优惠券 — 券包三态</li><li>C5 商品详情 — 领券区</li><li>C6 确认订单 — 选券/核销</li><li>获券弹窗 — 系统发券触达</li></ul>`},
  {side:'C',id:'获券弹窗',title:'获券弹窗（系统发券触达）',img:'coupon-prd-assets/coupon-app-arrival-modal.png',
   detail:`<h4>获券弹窗（系统发券触达）</h4><p>满足发券活动触发条件时自动弹出。</p><img src="coupon-prd-assets/coupon-app-arrival-modal.png"><p>弹窗元素：顶部标题+图标 / 券列表（可含多张）/ 底部按钮「去使用」「查看我的券」</p>`},
  {side:'C',id:'我的优惠券',title:'C2 我的优惠券（券包三态）',img:'coupon-prd-assets/coupon-c2-mycoupons.png',
   detail:`<h4>C2 我的优惠券（券包三态）</h4><p>用户查看自己持有的全部优惠券，分三个 Tab 展示不同状态。</p><img src="coupon-prd-assets/coupon-c2-mycoupons.png"><table><tr><th>Tab</th><th>内容</th><th>空态</th></tr><tr><td>可使用</td><td>可用券卡片</td><td>暂无可用优惠券</td></tr><tr><td>已使用</td><td>已核销券（灰态）</td><td>暂无使用记录</td></tr><tr><td>已过期</td><td>过期券（灰态）</td><td>暂无过期券</td></tr></table>`},
  {side:'C',id:'商品详情领券区',title:'C5 商品详情·领券区',img:'coupon-prd-assets/coupon-pd-coupon-list.png',
   detail:`<h4>C5 商品详情 · 领券区</h4><p>价格区下方，折叠条 + 横向可滑动券列表。</p><img src="coupon-prd-assets/coupon-pd-coupon-list.png"><p>交互：默认折叠→点展开→横向滑动券卡片→每张「立即领取」按钮。</p>`},
  {side:'C',id:'确认订单选券',title:'C6 确认订单·选券/核销',img:'coupon-prd-assets/coupon-c6-confirm-order.png',
   detail:`<h4>C6 确认订单 · 选券/核销</h4><p>确认订单页价格摘要区「优惠券」可折叠行，点开展示可用券列表（Radio 单选）。</p><img src="coupon-prd-assets/coupon-c6-confirm-order.png"><p>默认选中推荐券（抵扣最大）；可选「不使用优惠券」；实时计算应付金额。</p>`},
  {side:'C',id:'小程序H5',title:'小程序/H5 获券弹窗',img:'coupon-prd-assets/coupon-mini-h5.png',
   detail:`<h4>小程序 / H5 端</h4><p>本期仅新增<b>获券弹窗</b>（同 App 端逻辑），外壳不同。</p><img src="coupon-prd-assets/coupon-mini-h5.png"><p>⚠️ 我的优惠券/下单核销为已有功能，本期不重做。</p>`},

  // ── 后台 ──
  {side:'B',id:'平台端总览',title:'平台端后台总览',img:'coupon-prd-assets/coupon-platform.png',
   detail:`<h4>平台端后台总览</h4><p>左侧导航包含「优惠券管理」「发券活动管理」「数据看板」等模块。</p><img src="coupon-prd-assets/coupon-platform.png"><ul><li>P1 优惠券管理列表（沿用+补充列）</li><li>D1 券详情（新增）</li><li>D2 新建/编辑券（新增）</li><li>P2 发券活动列表（新增）</li><li>D3 规则引擎（新增）</li><li>P4 数据看板（新增）</li><li>P5 用户券查询（新增，嵌入会员管理）</li></ul>`},
  {side:'B',id:'P1券列表',title:'P1 优惠券管理列表',img:'coupon-prd-assets/coupon-platform.png',
   detail:`<h4>P1 优惠券管理列表</h4><p>沿用现有功能，本期补充「总库存」「创建日期」列与下架/删除按钮逻辑。</p>`},
  {side:'B',id:'D1券详情',title:'D1 券详情',img:'coupon-prd-assets/coupon-d1-coupon-detail.png',
   detail:`<h4>D1 券详情</h4><p>从 P1 列表点击「查看」进入。展示完整券配置信息（只读）。</p><img src="coupon-prd-assets/coupon-d1-coupon-detail.png"><p>含：券配置名称/编码/有效期/活动范围/商品选择/发放方式/状态。底部操作按钮：下架（进行中状态可点）。</p>`},
  {side:'B',id:'D2新建编辑券',title:'D2 新建/编辑优惠券',img:'coupon-prd-assets/coupon-d2-new-coupon.png',
   detail:`<h4>D2 新建/编辑优惠券</h4><p>规则引擎表单：券名称/类型/面额门槛/有效期/每人限领/发行量/适用范围。</p><img src="coupon-prd-assets/coupon-d2-new-coupon.png"><p>动态联动：券类型切换→面额门槛 label 变化；有效期类型切换→字段显隐。</p>`},
  {side:'B',id:'P2发券活动',title:'P2 发券活动 + D3 规则引擎',img:'coupon-prd-assets/coupon-p2-send-list.png',
   detail:`<h4>P2 发券活动 + D3 规则引擎</h4><p>P2：按触发源筛选的活动列表。</p><img src="coupon-prd-assets/coupon-p2-send-list.png"><p>D3：配置触发源/阈值/等级/券模板/每人上限/开始时间。</p><img src="coupon-prd-assets/coupon-d3-send-edit.png">`},
  {side:'B',id:'P4数据看板',title:'P4 数据看板',img:'coupon-prd-assets/coupon-p4-dashboard.png',
   detail:`<h4>P4 数据看板</h4><p>三维度 Tab：发放量/核销量/趋势图 + 券明细记录。</p><img src="coupon-prd-assets/coupon-p4-dashboard.png"><img src="coupon-prd-assets/coupon-p4-coupon-detail.png">`},
  {side:'B',id:'P5用户券查询',title:'P5 用户券查询',img:'coupon-prd-assets/coupon-p5-user-coupon.png',
   detail:`<h4>P5 用户券查询</h4><p>嵌入会员管理→用户详情页 Tab。按用户 ID/手机号查券实例。</p><img src="coupon-prd-assets/coupon-p5-user-coupon.png">`},
  {side:'B',id:'商家端',title:'商家端后台',img:'coupon-prd-assets/coupon-merchant.png',
   detail:`<h4>商家端后台</h4><p>首次具备券管理能力。交互同平台端，差异：数据隔离（仅本店铺券模板/活动）。</p><img src="coupon-prd-assets/coupon-merchant.png">`},
];

const $=id=>document.getElementById(id);
const gC=$('gridC'),gB=$('gridB'),ov=$('ov'),mt=$('mt'),mb=$('mb'),ifull=$('ifull');
let q='';

function cardHTML(p){
  return `<div class="card" data-id="${p.id}">
    <div class="card-img-wrap"><img class="card-img" src="${p.img}" alt="${p.title}" loading="lazy" onclick="full('${p.img}')"></div>
    <div class="card-info">
      <div class="card-name">${p.title}</div>
      <div class="card-btn-row"><button class="btn-v" onclick="openD('${p.id}')">查看详情</button></div>
    </div></div>`;
}

function render(){
  const f=PG.filter(p=>!q||p.title.includes(q)||p.id.includes(q));
  const c=f.filter(p=>p.side==='C'),b=f.filter(p=>p.side==='B');
  gC.innerHTML=c.map(cardHTML).join('');
  gB.innerHTML=b.map(cardHTML).join('');
  $('cntC').textContent=c.length;$('cntB').textContent=b.length;
  $('tc').textContent=f.length;
  $('empty').style.display=f.length?'none':'block';
  $('secC').style.display=c.length?'':'none';
  $('secB').style.display=b.length?'':'none';
}

function flt(){q=$('si').value.trim();render()}

function openD(id){
  const p=PG.find(x=>x.id===id);if(!p)return;
  mt.textContent=p.title;mb.innerHTML=p.detail;
  mb.querySelectorAll('img').forEach(im=>im.onclick=e=>{e.stopPropagation();full(im.src)});
  ov.classList.add('show');
}
function cls(){ov.classList.remove('show')}
function full(src){ifull.innerHTML=`<img src="${src}">`;ifull.classList.add('show')}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(ifull.classList.contains('show'))ifull.classList.remove('show');else cls()}
});

render();
</script>
</body>
</html>
